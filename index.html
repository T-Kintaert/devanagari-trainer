DEVANĀGARĪ TRAINER 3.1.5
Konzeption: Thomas Kintaert (Institut für Südasien-, Tibet- und Buddhismuskunde [ISTB], Universität Wien) Erstellungszeitraum: November 2025 – Juni 2026

TECHNISCHE UMSETZUNG: Diese Anwendung wurde im dialogischen Prozess mit Künstlicher Intelligenz entwickelt. Die Programmierung wurde durch den Einsatz der Google-Gemini-Modelle 2.5, 3, 3.1 und 3.5 (Flash und Pro) und des Claude-Modells Sonnet 4.6 ermöglicht.

QUELLEN & URHEBERRECHTE: • 360 häufigste Devanāgarī-Ligaturen: Stiehl, Ulrich. „2. Die häufigsten Ligaturen im klassischen Sanskrit (The 360 Ligatures of Classical Sanskrit with Frequency >= 0.010%)“. Devanagari, Sanskrit Web, S. 7–25, www.sanskritweb.net/deutsch/devanagari.pdf. Zugriff 6. Jan. 2026.

• Devanāgarī-Schriftart: Sanskrit 2003. Version 1.20, Omkarananda Ashram, 30. Juli 2019, www.omkarananda-ashram.org/Sanskrit/itranslator2003.htm. Zugriff 6. Jan. 2026.

HINWEIS ZUR DARSTELLUNG: Für eine optimale Anzeige der Schriftzeichen, insbesondere der komplexen Ligaturen, wird die Verwendung der Schriftart "Sanskrit2003 - 30.07.2019.otf" empfohlen. Sofern sich diese Datei im selben Verzeichnis wie die HTML-Datei der App befindet, wird sie automatisch für die Darstellung verwendet.

    /* 2. Schrift-Einbindung mit System-Check (local) */
    @font-face {
        font-family: 'Sanskrit2003'; 
        src: local('Sanskrit 2003'), 
             local('Sanskrit2003'),
             url("fonts/Sanskrit2003 - 30.07.2019.otf") format('opentype'),
             url("https://t-kintaert.github.io/devanagari-trainer/fonts/Sanskrit2003%20-%2030.07.2019.otf") format('opentype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
    }
    
    body { 
        font-family: 'Noto Sans', sans-serif;
        margin: 0;
        padding: 0;
    }

    /* 3. Layout-Bereinigung (Zurück zum Standard) */
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            /* Erlaubt vertikales Scrollen, verhindert horizontales Wackeln */
            overflow-x: hidden;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch;
        }

        /* Darkmode-Hintergrund für das gesamte Dokument */
        html.dark body { 
            background-color: #1c1917 !important; 
        }

        .app-wrapper { 
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0; /* Keinerlei Padding mehr, das Ränder erzeugen könnte */
        }
        }

    .font-deva { 
        font-family: 'Sanskrit2003', 'Noto Serif Devanagari', serif; 
        font-size: 1.15em; 
        line-height: 1.3;
    }

    /* 4. Animationen und Spezial-Stile */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px) translateX(var(--tw-translate-x)); }
        to { opacity: 1; transform: translateY(0) translateX(var(--tw-translate-x)); }
    }
    .popup-anim { animation: fadeIn 0.2s ease-out forwards; }
    .card-flip { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }

    .syllable-hover { 
        padding-top: 4px;
        padding-bottom: 2px;
        outline-offset: 1px;
        transition: outline 0.1s; 
        outline: 2px solid transparent; 
        border-radius: 4px; 
        cursor: pointer;

const APP_VERSION = "3.1.5";
async function checkForUpdates() {
  try {
    // Schutz vor file:// Protokoll: Bricht im lokalen Offline-Modus lautlos ab
    if (!window.location.protocol.startsWith('http')) {
      console.log("Lokaler Datei-Modus. Update-Check deaktiviert.");
      return;
    }
    const response = await fetch(window.location.href, {
      cache: 'no-store',
      headers: {
        'Cache-Control': 'no-cache'
      }
    });
    if (!response.ok) return;
    const htmlText = await response.text();
    const match = htmlText.match(/const\s+APP_VERSION\s*=\s*["']([^"']+)["']/);
    if (match && match[1]) {
      const serverVersion = match[1];
      if (serverVersion !== APP_VERSION) {
        showUpdateNotification(serverVersion);
      }
    }
  } catch (error) {
    console.log("Server nicht erreichbar oder offline. Keine Update-Prüfung.");
  }
}
function showUpdateNotification(newVersion) {
  const banner = document.createElement('div');
  banner.setAttribute('style', 'position:fixed; bottom:20px; right:20px; ' + 'background:#1c1917; color:#f1f0ef; ' + 'padding:20px; border-radius:16px; ' + 'box-shadow:0 20px 40px rgba(0,0,0,0.5); ' + 'z-index:99999; max-width:280px; ' + 'border:1px solid rgba(120,113,108,0.4); ' + 'font-family:sans-serif; font-size:14px; position:relative;');
  banner.innerHTML = `
      <button onclick="this.closest('div').remove()" style="position:absolute; top:10px; right:12px; background:none; border:none; color:#78716c; font-size:16px; cursor:pointer; line-height:1;">✕</button>
      <p style="margin:0 0 6px 0; font-weight:bold; color:#f43f5e;">Update verfügbar! (v${newVersion})</p>
      <p style="margin:0 0 14px 0; font-size:13px; color:#a8a29e;">Der Browser nutzt eine alte Version aus dem Cache.</p>
      <button onclick="window.location.reload(true)" style="
        display:block; width:100%; background:#e11d48;
        color:#fff; font-weight:bold; padding:8px 16px;
        border:none; border-radius:10px; font-size:12px;
