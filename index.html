<!--
DEVANĀGARĪ TRAINER 2.1
Konzeption: Thomas Kintaert (Institut für Südasien-, Tibet- und Buddhismuskunde [ISTB], Universität Wien) Erstellungszeitraum: November 2025 – Mai 2026

TECHNISCHE UMSETZUNG: Diese Anwendung wurde im dialogischen Prozess mit Künstlicher Intelligenz entwickelt. Die Programmierung wurde durch den Einsatz der Google-Gemini- Modelle 2.5 und 3 (Flash und Pro, inkl. der Gemini-Funktion Canvas) ermöglicht.

QUELLEN & URHEBERRECHTE: • 360 häufigste Devanāgarī-Ligaturen: Stiehl, Ulrich. „2. Die häufigsten Ligaturen im klassischen Sanskrit (The 360 Ligatures of Classical Sanskrit with Frequency >= 0.010%)“. Devanagari, Sanskrit Web, S. 7–25, www.sanskritweb.net/deutsch/devanagari.pdf. Zugriff 6. Jan. 2026.

• Devanāgarī-Schriftart: Sanskrit 2003. Version 1.20, Omkarananda Ashram, 30. Juli 2019, www.omkarananda-ashram.org/Sanskrit/itranslator2003.htm. Zugriff 6. Jan. 2026.

HINWEIS ZUR DARSTELLUNG: Für eine optimale Anzeige der Schriftzeichen, insbesondere der komplexen Ligaturen, wird die Verwendung der Schriftart "Sanskrit2003 - 30.07.2019.otf" empfohlen. Sofern sich diese Datei im selben Verzeichnis wie die HTML-Datei der App befindet, wird sie automatisch für die Darstellung verwendet.

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanskrit Devanāgarī Trainer (Custom Font)</title>
    
    <!-- React und ReactDOM laden -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel für JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        stone: {
                            850: '#1c1917',
                            900: '#0c0a09',
                        },
                        amber: {
                            450: '#f59e0b',
                        }
                    }
                }
            }
        }
    </script>

<style>
    /* 1. Google Fonts Fallback */
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&family=Noto+Serif:wght@400;700&family=Noto+Serif+Devanagari:wght@400;700&display=swap');

    /* 2. Schrift-Einbindung mit System-Check (local) */
    @font-face {
        font-family: 'Sanskrit2003'; 
        src: local('Sanskrit 2003'), 
             local('Sanskrit2003'),
             url("Sanskrit2003 - 30.07.2019.otf") format('opentype'),
             url("https://t-kintaert.github.io/devanagari-trainer/Sanskrit2003%20-%2030.07.2019.otf") format('opentype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
    }
    
    body { 
        font-family: 'Noto Sans', sans-serif;
        margin: 0;
        padding: 0;
    }

    /* 3. Layout-Bereinigung (Zurück zum Standard) */
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            /* Erlaubt vertikales Scrollen, verhindert horizontales Wackeln */
            overflow-x: hidden;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch;
        }

        /* Darkmode-Hintergrund für das gesamte Dokument */
        html.dark body { 
            background-color: #1c1917 !important; 
        }

        .app-wrapper { 
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0; /* Keinerlei Padding mehr, das Ränder erzeugen könnte */
        }
        }

    .font-deva { 
        font-family: 'Sanskrit2003', 'Noto Serif Devanagari', serif; 
        font-size: 1.15em; 
        line-height: 1.3;
    }

    /* 4. Animationen und Spezial-Stile */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px) translateX(var(--tw-translate-x)); }
        to { opacity: 1; transform: translateY(0) translateX(var(--tw-translate-x)); }
    }
    .popup-anim { animation: fadeIn 0.2s ease-out forwards; }
    .card-flip { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }

    .syllable-hover { 
        padding-top: 4px;
        padding-bottom: 2px;
        outline-offset: 1px;
        transition: outline 0.1s; 
        outline: 2px solid transparent; 
        border-radius: 4px; 
        cursor: pointer;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;
    }
    .pacer-highlight-light { background-color: #fef3c7; outline: 2px solid #f59e0b; }
    .pacer-highlight-dark { background-color: #78350f; outline: 2px solid #fbbf24; }
    .text-area-with-popup-visible { cursor: default; }    
    
    .glow-emerald { box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
    .glow-amber { box-shadow: 0 0 15px rgba(245, 158, 11, 0.3); }

    .iast-sharp {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        text-shadow: 0 0 0.1px rgba(0,0,0,0.2);
        transform: translateZ(0);
        backface-visibility: hidden;
    }
</style>
</head>
<body>
    <div class="app-wrapper">
        <div id="root"></div>
    </div>

    <!-- ################################################################################## -->
    <!-- ########################### HAUPT-LOGIK BLOCK (REACT/UI) ######################### -->
    <!-- ################################################################################## -->
    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // --- ICONS (Basis-UI) ---
        // ICON_WRAPPER_FIX
        const IconWrapper = ({ children, className, size = 24 }) => (
            <div 
                className={`inline-flex items-center justify-center ${className}`}
                style={{ width: '24px', height: '24px', flexShrink: 0 }}
            >
                <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    width={size} 
                    height={size} 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    strokeWidth="2" 
                    strokeLinecap="round" 
                    strokeLinejoin="round"
                    style={{ overflow: 'visible' }}
                >
                    {children}
                </svg>
            </div>
        );
        const OmIcon = ({ size = 32, className = "" }) => ( <span className={`font-deva leading-none select-none ${className}`} style={{ fontSize: size }}>ॐ</span> );
        const Moon = ({ className = "" }) => ( // JSX in Klammern, um Babel-Fehler zu vermeiden
            <IconWrapper className={className}>
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </IconWrapper>
        );
        const Sun = ({ className = "" }) => (
            <IconWrapper className={className}>
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </IconWrapper>
        );

        const Clock = ({ className = "" }) => (
            <IconWrapper className={className} size={18}>
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </IconWrapper>
        );
		
		const FileText = ({ className = "" }) => (
            <IconWrapper className={className}>
                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <line x1="10" y1="9" x2="8" y2="9"></line>
            </IconWrapper>
        );
        const XIcon = ({ className = "" }) => ( // JSX in Klammern, um Babel-Fehler zu vermeiden
            <IconWrapper className={className}>
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </IconWrapper>
        );
        const ArrowRight = ({ className = "" }) => ( // JSX in Klammern, um Babel-Fehler zu vermeiden
            <IconWrapper className={className}>
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </IconWrapper>
        );
        const ArrowLeft = ({ className = "" }) => ( // JSX in Klammern, um Babel-Fehler zu vermeiden
            <IconWrapper className={className}>
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </IconWrapper>
        );
const CheckIcon = ({ size = 24, className = "" }) => (
            <IconWrapper size={size} className={className}><polyline points="20 6 9 17 4 12"></polyline></IconWrapper>
        );
		const ArrowUpDown = ({ className = "" }) => (
			<IconWrapper className={className}>
				<path d="m21 16-4 4-4-4"></path>
				<path d="M17 20V4"></path>
				<path d="m3 8 4-4 4 4"></path>
				<path d="M7 4v16"></path>
			</IconWrapper>
		);

        const ExportIcon = ({ size = 24, className = "" }) => (
            <IconWrapper size={size} className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></IconWrapper>
        );

        const ImportIcon = ({ size = 24, className = "" }) => (
            <IconWrapper size={size} className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></IconWrapper>
        );
		const ChevronDown = ({ className = "" }) => (
            <IconWrapper className={className} size={18}>
                <polyline points="6 9 12 15 18 9"></polyline>
            </IconWrapper>
        );
        const ChevronRight = ({ className = "" }) => (
            <IconWrapper className={className} size={18}>
                <polyline points="9 18 15 12 9 6"></polyline>
            </IconWrapper>
        );
		const ChevronUp = ({ className = "" }) => (
            <IconWrapper className={className} size={18}>
                <polyline points="18 15 12 9 6 15"></polyline>
            </IconWrapper>
        );

        const EyeIcon = ({ size = 24, className = "" }) => (
            <IconWrapper size={size} className={className}>
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </IconWrapper>
        );

        const InfoIcon = ({ size = 24, className = "" }) => (
            <IconWrapper size={size} className={className}>
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </IconWrapper>
        );

        // SETTINGS_ICON_FIXED_PATH_V12
        const ImageIcon = ({ size = 24, className = "" }) => (
            <IconWrapper size={size} className={className}>
                <rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect>
                <circle cx="9" cy="9" r="2"></circle>
                <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path>
            </IconWrapper>
        );

        const SettingsIcon = ({ size = 24, className = "" }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="-2 -2 28 28" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
                style={{ flexShrink: 0, overflow: 'visible' }}
            >
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        );
        
        // --- HILFSFUNKTIONEN ---
        const shuffleArray = (array) => {
          const newArray = [...array];
          for (let i = newArray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
          }
          return newArray;
        };

        const InfoPopup = ({ x, y, content, onClose }) => {
            if (!content || !content.word) return null;
            const screenW = window.innerWidth;
            const isMobile = window.matchMedia("(pointer: coarse)").matches;
            
            const boxWidth = 220;
            const threshold = isMobile ? 160 : 240;
            const spaceRight = screenW - x;
            const shiftLeft = spaceRight < threshold;

            // Berechnung der X-Position, um Cut-Offs am linken Rand zu vermeiden
            let finalX = x;
            if (shiftLeft) {
                finalX = Math.max(boxWidth + 20, x - 10); 
            } else {
                finalX = Math.min(x, screenW - boxWidth - 20);
            }

            const boxStyle = { 
                top: `${isMobile ? y - 55 : y}px`, 
                left: `${finalX}px`,
                position: 'fixed'
            };
            
            let boxClass = `pointer-events-none z-[3000] bg-white dark:bg-stone-800 text-stone-800 dark:text-stone-200 text-sm px-4 py-3 rounded-xl shadow-2xl popup-anim max-w-[220px] border border-stone-200 dark:border-stone-700 transform -translate-y-1/2 ${shiftLeft ? '-translate-x-full' : ''}`;

            return (
                <div className={boxClass} style={boxStyle}>
                    <div 
                        className="font-serif font-bold mb-1 text-rose-700 dark:text-rose-400 border-b border-stone-100 dark:border-stone-700 pb-1"
                        dangerouslySetInnerHTML={{ __html: content.word }}
                    />
                    <div 
                        className="leading-snug text-xs sm:text-sm"
                        dangerouslySetInnerHTML={{ __html: content.def }}
                    />
                </div>
            );
        };
        
       // --- TrainerCard ---
        const TrainerCard = ({ front, back, showBack, setShowBack, isAnimating, frontLang, backLang, themeColor = 'rose', isTouch, customFont, frontImage, backImage, note, onInfoClick, lang }) => {
            const themeClasses = {
                rose: 'bg-rose-50 dark:bg-rose-950/30 border-rose-200 dark:border-rose-700/50 text-rose-800 dark:text-rose-200',
                indigo: 'bg-indigo-50 dark:bg-indigo-950/30 border-indigo-200 dark:border-indigo-700/50 text-indigo-800 dark:text-indigo-200',
                stone: 'bg-stone-50 dark:bg-stone-700/40 border-stone-200 dark:border-stone-500 text-stone-800 dark:text-stone-200'
            }[themeColor] || themeColor;

            const renderContent = (content, image, lang, isCustomFont) => {
                if (image) return (
                    <img src={image} alt="Sanskrit Zeichen" className="max-h-[4.1rem] w-auto object-contain bg-transparent dark:invert dark:opacity-90 dark:mix-blend-screen transition-all select-none" />
                );
                return (
                    <span 
                        className={lang === 'deva' ? 'text-8xl font-deva' : lang === 'iast' ? 'text-3xl iast-sharp font-bold px-2 text-center' : 'text-3xl font-serif font-bold px-2 text-center'}
                        style={lang === 'deva' && isCustomFont ? { fontFamily: `"${isCustomFont}", Sanskrit2003, "Noto Serif Devanagari", serif` } : {}}
                        dangerouslySetInnerHTML={{ __html: content }}
                    />
                );
            };

            return (
                <div className="flex flex-col items-center justify-center h-64 w-full max-w-sm mx-auto cursor-pointer perspective-1000" onClick={() => setShowBack(!showBack)}>
                    <div className={`relative w-full h-full transition-transform transform-style-3d ${isAnimating ? 'duration-500' : 'duration-0'} ${showBack ? 'rotate-y-180' : ''}`}>
                        {/* VORDERSEITE */}
                        <div className="absolute w-full h-full bg-white dark:bg-stone-800 border-2 border-stone-200 dark:border-stone-600 rounded-xl shadow-xl flex flex-col items-center justify-center backface-hidden overflow-hidden">
                            {renderContent(front, frontImage, frontLang, customFont)}
                            <div className="absolute bottom-4 text-stone-400 text-[10px] uppercase tracking-widest text-center px-2">
								{isTouch ? TRANSLATIONS[lang].flipHintTap : TRANSLATIONS[lang].flipHintClick}
							</div>
                        </div>
                        {/* RÜCKSEITE */}
                        <div className={`absolute w-full h-full rounded-xl border-2 shadow-xl flex flex-col items-center justify-center backface-hidden rotate-y-180 transition-colors overflow-hidden ${themeClasses}`}>
                            {/* Info-Icon auf der Rückseite */}
                            {note && (
                                <button 
                                    onClick={(e) => {
                                        e.stopPropagation();
                                        onInfoClick(e, "Information", note);
                                    }}
                                    className="absolute top-3 right-3 p-2 text-stone-400/50 hover:text-stone-600 dark:hover:text-stone-200 z-30 transition-colors"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                                </button>
                            )}
                            {renderContent(back, backImage, backLang, null)}
                        </div>
                    </div>
                </div>
            );
        };

        // --- DATENGENERATOR (Vokaldiakritika) ---
        // Generiert Einträge (33 Konsonanten x 14 Vokalvariationen abzüglich der Ausschlüsse)
        const generateDiacriticsData = () => {
            const consonants = [
                {d:'क', t:'k'}, {d:'ख', t:'kh'}, {d:'ग', t:'g'}, {d:'घ', t:'gh'}, {d:'ङ', t:'ṅ'},
                {d:'च', t:'c'}, {d:'छ', t:'ch'}, {d:'ज', t:'j'}, {d:'झ', t:'jh'}, {d:'ञ', t:'ñ'},
                {d:'ट', t:'ṭ'}, {d:'ठ', t:'ṭh'}, {d:'ड', t:'ḍ'}, {d:'ढ', t:'ḍh'}, {d:'ण', t:'ṇ'},
                {d:'त', t:'t'}, {d:'थ', t:'th'}, {d:'द', t:'d'}, {d:'ध', t:'dh'}, {d:'न', t:'n'},
                {d:'प', t:'p'}, {d:'फ', t:'ph'}, {d:'ब', t:'b'}, {d:'भ', t:'bh'}, {d:'म', t:'m'},
                {d:'य', t:'y'}, {d:'र', t:'r'}, {d:'ल', t:'l'}, {d:'व', t:'v'},
                {d:'श', t:'ś'}, {d:'ष', t:'ṣ'}, {d:'स', t:'s'}, {d:'ह', t:'h'}
            ];

            // Vokale, Anusvāra (aṃ) und Visarga (aḥ): a, ā, i, ī, u, ū, ṛ, ṝ, ḷ, e, ai, o, au, aṃ, aḥ
            const vowels = [
    {d:'', t:'a', excludes: []}, 
    {d:'ा', t:'ā', excludes: ['ṅ', 'ñ']},  
    {d:'ि', t:'i', excludes: ['ṅ', 'ñ']},  
    {d:'ी', t:'ī', excludes: ['ṅ', 'ñ']}, 
    {d:'ु', t:'u', excludes: ['ṅ', 'ñ']},  
    {d:'ू', t:'ū', excludes: ['ṅ', 'ñ']}, 
    {d:'ृ', t:'ṛ', excludes: ['ṅ', 'ñ', 'r']}, // r + ṛ existiert nicht als Diakritikum
    
    // ṝ (Langes vokalisches R): Erlaubt nur nach g, j, t, d, n, s
    {d:'ॄ', t:'ṝ', excludes: [
        'k', 'kh', 'gh', 'ṅ', 'c', 'ch', 'jh', 'ñ', 'ṭ', 'ṭh', 'ḍ', 'ḍh', 'ṇ', 
        'th', 'dh', 'p', 'ph', 'b', 'bh', 'm', 'y', 'r', 'l', 'v', 'ś', 'ṣ', 'h'
    ]},
    
    // ḷ (Vokalisches L): Erlaubt nur nach k (√kḷp)
    {d:'ॢ', t:'ḷ', excludes: [
        'kh', 'g', 'gh', 'ṅ', 'c', 'ch', 'j', 'jh', 'ñ', 'ṭ', 'ṭh', 'ḍ', 'ḍh', 'ṇ', 
        't', 'th', 'd', 'dh', 'n', 'p', 'ph', 'b', 'bh', 'm', 'y', 'r', 'l', 'v', 'ś', 'ṣ', 's', 'h'
    ]},
    
    {d:'े', t:'e', excludes: ['ṅ', 'ñ']},  
    {d:'ै', t:'ai', excludes: ['ṅ', 'ñ']}, 
    {d:'ो', t:'o', excludes: ['ṅ', 'ñ']},  
    {d:'ौ', t:'au', excludes: ['ṅ', 'ñ']},
    {d:'ं', t:'aṃ', excludes: ['ṅ', 'ñ']}, 
    {d:'ः', t:'aḥ', excludes: ['ṅ', 'ñ']}  
];

            // Liste der explizit ausgeschlossenen Kombinationen (bleibt leer, da jetzt alles über vowels geregelt wird)
const EXCLUDED_COMBINATIONS = new Set([]);

            const list = [];
            consonants.forEach(c => {
                vowels.forEach(v => {
                    const combination = c.t + v.t;

                    // 1. Ausschluss von ñ/ṅ mit den meisten Vokaldiakritika (außer a)
                    if (v.t !== 'a' && v.excludes && v.excludes.includes(c.t)) {
                        return;
                    }
                    
                    // 2. Standard-Ausschlüsse (für ḷ und einige ṝ Kombinationen)
                    if (EXCLUDED_COMBINATIONS.has(combination)) return;

        // --- ICONS ---
        const ClockIcon = ({ className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>

                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
        );
       
        // --- TRANSLITERATIONSLOGIK ---

        const DEVA_TO_IAST = {
            'अ': 'a', 'आ': 'ā', 'इ': 'i', 'ई': 'ī', 'उ': 'u', 'ऊ': 'ū', 'ऋ': 'ṛ', 'ॠ': 'ṝ', 'ऌ': 'ḷ', 'ए': 'e', 'ऐ': 'ai', 'ओ': 'o', 'औ': 'au',
            'क': 'ka', 'ख': 'kha', 'ग': 'ga', 'घ': 'gha', 'ङ': 'ṅa',
            'च': 'ca', 'छ': 'cha', 'ज': 'ja', 'झ': 'jha', 'ञ': 'ña',
            'ट': 'ṭa', 'ठ': 'ṭha', 'ड': 'ḍa', 'ढ': 'ḍha', 'ण': 'ṇa',
            'त': 'ta', 'थ': 'tha', 'द': 'da', 'ध': 'dha', 'न': 'na',
            'प': 'pa', 'फ': 'pha', 'ब': 'ba', 'भ': 'bha', 'म': 'ma',
            'य': 'ya', 'र': 'ra', 'ल': 'la', 'व': 'va', 
            'श': 'śa', 'ष': 'ṣa', 'स': 'sa', 'ह': 'ha',
            'ज्ञ': 'jña', 'त्र': 'tra', 'क्ष': 'kṣa', 'श्र': 'śra',
            '।': '.', '॥': '..', 'ऽ': "'", '॰': '.', 
            '०': '0', '१': '1', '२': '2', '३': '3', '४': '4', '५': '5', '६': '6', '७': '7', '८': '8', '९': '9'
        };

        const DEVA_MATRAS = {
            'ा': 'ā', 'ि': 'i', 'ी': 'ī', 'ु': 'u', 'ू': 'ū', 'ृ': 'ṛ', 'ॄ': 'ṝ', 'ॢ': 'ḷ',
            'े': 'e', 'ै': 'ai', 'ो': 'o', 'ौ': 'au'
        };
        
        const DEVA_MODIFIERS = {
            'ं': 'ṃ', 'ः': 'ḥ', 'ँ': 'm̐'
        };

        const devanagariToIast = (devaText) => {
            let iast = '';
            for (let i = 0; i < devaText.length; i++) {
                const char = devaText[i];
                if (char === '्') {
                    if (iast.endsWith('a')) iast = iast.slice(0, -1);
                    continue;
                }
                if (DEVA_MODIFIERS[char]) {
                    iast += DEVA_MODIFIERS[char];
                    continue;
                }
                if (DEVA_MATRAS[char]) {
                    if (iast.endsWith('a')) iast = iast.slice(0, -1);
                    iast += DEVA_MATRAS[char];
                    continue;
                }
                const mapped = DEVA_TO_IAST[char];
                if (mapped) {
                    iast += mapped;
                    continue;
                }
                iast += char;
            }
            return iast;
        };

        const countSyllables = (devaText) => {
            if (!devaText) return 0;
            const INDEPENDENT_VOWELS = 'अआइईउऊऋॠऌॡएऐओऔॐ'; 
            const MATRAS = 'ािीुूृॄॢॣेैोौ'; 
            const VIRAMA = '्';
            
            const isConsonant = (char) => {
                const code = char.charCodeAt(0);
                return (code >= 0x0915 && code <= 0x0939) || (code >= 0x0958 && code <= 0x095F);
            };

            const isIndependentVowel = (char) => INDEPENDENT_VOWELS.includes(char);
            const isMatra = (char) => MATRAS.includes(char);
            
            let count = 0;
            for (let i = 0; i < devaText.length; i++) {
                const char = devaText[i];
                const nextChar = devaText[i + 1];

                if (isIndependentVowel(char)) count++;
                else if (isMatra(char)) count++;
                else if (isConsonant(char)) {
                    const nextIsVirama = nextChar === VIRAMA;
                    const nextIsMatra = nextChar && isMatra(nextChar);
                    if (!nextIsVirama && !nextIsMatra) count++;
                }
            }
            return count;
        };

        /**
         * Zerlegt einen Devanagari-String in visuelle Silbenblöcke (Akṣaras).
         */
        const splitIntoAksharas = (text) => {
            const aksharas = [];
            let current = '';
            const chars = Array.from(text);

            for (let i = 0; i < chars.length; i++) {
                const char = chars[i];
                const code = char.charCodeAt(0);

                const isVirama = (char === '्');
                const isModifier = (char === 'ं' || char === 'ः' || char === 'ँ');
                const isMatra = (code >= 0x093E && code <= 0x094C) || (code >= 0x0962 && code <= 0x0963);
                const isIndependent = (code >= 0x0904 && code <= 0x0914) || char === 'ॐ';
                const isConsonant = ((code >= 0x0915 && code <= 0x0939) || (code >= 0x0958 && code <= 0x095F));

                let startNew = false;
                
                // Unabhängiger Vokal beginnt immer einen neuen Block
                if (isIndependent) {
                    startNew = true;
                } 
                // Konsonant
                else if (isConsonant) {
                    // Startet neuen Block, es sei denn, das vorherige Zeichen war ein Virāma (dann ist es eine Ligatur)
                    if (current.length > 0 && current[current.length-1] === '्') {
                        startNew = false; 
                    } else {
                        startNew = true;
                    }
                }

                if (startNew && current) {
                    aksharas.push(current);
                    current = '';
                }
                current += char;
            }
            if (current) aksharas.push(current);
            return aksharas;
        };

        const IASTInfoPopup = ({ x, y, content, isSyllableMode, onClose }) => {
            if (!content) return null;
            const isDark = document.documentElement.classList.contains('dark');
            
            // top: y + 4 sorgt für einen kleinen Abstand zum Text, da der Pfeil fehlt
            let boxStyle = { 
                top: Math.round(y + 8), 
                left: Math.round(x),
                position: 'absolute' 
            }; 
            
            // Definition der Box-Basis
            let boxClass = `z-50 text-lg px-4 py-2 rounded shadow-xl popup-anim w-max max-w-[85vw] whitespace-nowrap transform `;
            
            if (content.length > 40) {
                boxClass = boxClass.replace('whitespace-nowrap', 'whitespace-normal break-all');
            }
         
            // FARBLOGIK
            if (isSyllableMode) {
                boxClass += isDark 
                    ? "bg-emerald-900 text-emerald-50 border border-emerald-700 glow-emerald" 
                    : "bg-emerald-50 text-emerald-900 shadow-lg border border-emerald-200";
            } else {
                boxClass += isDark 
                    ? "bg-stone-800 text-amber-450 glow-amber" 
                    : "bg-amber-100 text-black shadow-lg";
            }

            // Ausrichtung: Linksbündig ohne Verschiebung
            boxClass += " -translate-x-0"; 

            return (
                <div className={boxClass} style={boxStyle} onMouseLeave={onClose}>
                    <div 
						className="iast-sharp font-medium text-center" 
						style={{ fontFamily: 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif' }}
						dangerouslySetInnerHTML={{ __html: content }}
					/>
                </div>
            );
        };

        const FluencyTrainer = ({ onExit, darkMode, lang, isTheaterMode, setIsTheaterMode }) => {
		const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
		const SANSKRIT_SAMPLES = {
'Beispieltext': {
                    info: "Kālidāsa, Kumārasaṃbhava 1.1–8; https://gretil.sub.uni-goettingen.de/gretil/1_sanskr/5_poetry/2_kavya/kakumspu.htm (02.01.2026)",
                    text:`अस्त्युत्तरस्यां दिशि देवतात्मा हिमालयो नाम नगाधिराजः।
पूर्वापरौ तोयनिधी विगाह्य स्थितः पृथिव्या इव मानदण्डः॥१।१॥
यं सर्वशैलाः परिकल्प्य वत्सं मेरौ स्थिते दोग्धरि दोहदक्षे।
भास्वन्ति रत्नानि महौषधीश्च पृथूपदिष्टां दुदुहुर्धरित्रीम्॥१।२॥
अनन्तरत्नप्रभवस्य यस्य हिमं न सौभाग्यविलोपि जातम्। 
एको हि दोषो गुणसंनिपाते निमज्जतीन्दोः किरणेष्विवाङ्कः॥१।३॥
यश्चाप्सरोविभ्रममण्डनानां संपादयित्रीं शिखरैर्बिभर्ति।
बलाहकच्छेदविभक्तरागामकालसंध्यामिव धातुमत्ताम्॥१।४॥
आमेखलं संचरतां घनानां छायामधःसानुगतां निषेव्य।
उद्वेजिता वृष्टिभिराश्रयन्ते शृङ्गाणि यस्यातपवन्ति सिद्धाः॥१।५॥
पदं तुषारस्रुतिधौतरक्तं यस्मिन्नदृष्ट्वापि हतद्विपानाम्।
विदन्ति मार्गं नखरन्ध्रमुक्तैर्मुक्ताफलैः केसरिणां किराताः॥१।६॥
न्यस्ताक्षरा धातुरसेन यत्र भूर्जत्वचः कुञ्जरबिन्दुशोणाः। 
व्रजन्ति विद्याधरसुन्दरीणामनङ्गलेखक्रिययोपयोगम्॥१।७॥
यः पूरयन्कीचकरन्ध्रभागान्दरीमुखोत्थेन समीरणेन।
उद्गास्यतामिच्छति किंनराणां तानप्रदायित्वमिवोपगन्तुम्॥१।८॥`
				}
            };
            const [readingState, setReadingState] = useState('input');		
            const [textInput, setTextInput] = useState('');
            const [devaOutput, setDevaOutput] = useState(''); 
            const [syllableCount, setSyllableCount] = useState(0);
            const [startTime, setStartTime] = useState(null);
            const [endTime, setEndTime] = useState(null);
            const [finalSyllableCount, setFinalSyllableCount] = useState(0); 
			const [indent, setIndent] = useState(0);
            
            // NEUE PACER-STATES
            const [pacerActive, setPacerActive] = useState(false);
            const [pacerSpeed, setPacerSpeed] = useState(200); // FIX: Standard auf 200 SPM
            const [highlightedAksharaIndex, setHighlightedAksharaIndex] = useState(-1);
            
            const [popup, setPopup] = useState({ visible: false, x: 0, y: 0, content: '', isSyllable: false });
			const [helpExpanded, setHelpExpanded] = useState(false);

            useEffect(() => {
                const text = textInput;
                setDevaOutput(text);
                setSyllableCount(countSyllables(text));
                
                if (readingState !== 'input') {
                    setReadingState('input'); 
                }
            }, [textInput]);

            const startReading = useCallback(() => {
                if (!devaOutput.trim()) return;
                setReadingState('reading');
                setStartTime(Date.now());
                setEndTime(null);
                setFinalSyllableCount(syllableCount);
                setHighlightedAksharaIndex(pacerActive ? 0 : -1); // Starte Pacer, falls aktiv
            }, [devaOutput, syllableCount, pacerActive]);

            const finishReading = useCallback(() => {
                const finalTime = Date.now();
                setEndTime(finalTime);
                setReadingState('result');
                setHighlightedAksharaIndex(-1);
                setPopup(prev => ({ ...prev, visible: false }));
                // Fokus auf Neustart-Button für Enter-Taste
                setTimeout(() => document.getElementById('btn-restart')?.focus(), 100);
            }, []);

            const finishReadingAtSyllable = useCallback((syllableIndex) => {
                const finalTime = Date.now();
                setEndTime(finalTime);
                setFinalSyllableCount(syllableIndex + 1);
                setReadingState('result');
                setHighlightedAksharaIndex(-1);
                setPopup(prev => ({ ...prev, visible: false }));
                // Fokus auf Neustart-Button für Enter-Taste
                setTimeout(() => document.getElementById('btn-restart')?.focus(), 100);
            }, []);
            
            // PACER LOGIC
            useEffect(() => {
                if (readingState === 'reading' && pacerActive && highlightedAksharaIndex < syllableCount) {
                    // Berechnung der Verzögerung pro Silbe in Millisekunden:
                    // (60 Sekunden / SPM) * 1000 ms/s
                    const delayMs = (60 / (pacerSpeed || 1)) * 1000;
                    
                    const pacerTimer = setTimeout(() => {
                        const nextIndex = highlightedAksharaIndex + 1;
                        if (nextIndex < syllableCount) {
                            setHighlightedAksharaIndex(nextIndex);
                        } else {
                            // Pacer am Ende des Textes
                            finishReading();
                        }
                    }, delayMs);

                    return () => clearTimeout(pacerTimer);
                }
            }, [readingState, pacerActive, highlightedAksharaIndex, syllableCount, pacerSpeed, finishReading]);


            const [liveDuration, setLiveDuration] = useState('0.0');
            useEffect(() => {
                let interval;
                if (readingState === 'reading' && startTime) {
                    interval = setInterval(() => {
						setLiveDuration(((Date.now() - startTime) / 1000).toFixed(1).replace('.', ','));
					}, 100); 
                } else if (readingState === 'result' && startTime && endTime) {
					 setLiveDuration(((endTime - startTime) / 1000).toFixed(2).replace('.', ','));
				} else {
                    setLiveDuration('0.0');
                }
                return () => clearInterval(interval);
            }, [readingState, startTime, endTime]);

            const currentDuration = readingState === 'result' ? liveDuration : liveDuration;

            const calculateSPM = useMemo(() => {
                if (startTime && endTime && finalSyllableCount > 0) { 
                    const durationInMinutes = (endTime - startTime) / 60000;
                    return Math.round(finalSyllableCount / durationInMinutes);
                }
                return 0;
            }, [startTime, endTime, finalSyllableCount]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape' && isTheaterMode) {
                        setIsTheaterMode(false);
                        return;
                    }

                    if (e.key === 'Escape' || (e.key === 'ArrowLeft' && readingState === 'input' && document.activeElement.tagName !== 'TEXTAREA')) {
                        if (readingState === 'result') setReadingState('review');
                        else if (readingState === 'reading') setReadingState('review');
                        else if (readingState === 'review') setReadingState('input');
                        else if (readingState === 'input') onExit();
                        return;
                    }

                    if (e.key === 'Tab') {
                        e.preventDefault();
                        if (e.shiftKey) setIndent(prev => Math.max(0, prev - 20));
                        else setIndent(prev => prev + 20);
                    }
					
					if (e.key === 'Enter') {
                        if (readingState === 'input' && textInput.trim()) setReadingState('review');
                        else if (readingState === 'review') startReading();
                        else if (readingState === 'reading') finishReading();
                        else if (readingState === 'result') setReadingState('review');
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [readingState, textInput, startReading, finishReading, onExit, isTheaterMode]);
// Tastatursteuerung für die ErgebnisSeite (Pfeiltasten)
useEffect(() => {
    if (readingState !== 'result') return; 

    const handleKeyDown = (e) => {
        const restartBtn = document.getElementById('btn-restart');
        const newTextBtn = document.getElementById('btn-new-text');

        if (e.key === 'ArrowLeft') {
            newTextBtn?.focus();
        } else if (e.key === 'ArrowRight') {
            restartBtn?.focus();
        } else if (e.key === 'Enter') {
            // Verhindert, dass die globale Enter-Logik (Zeile 335) ausgeführt wird
            e.stopImmediatePropagation();
        }
    };

    // 'capture: true' sorgt dafür, dass dieser Listener VOR dem anderen ausgeführt wird
    window.addEventListener('keydown', handleKeyDown, true);
    return () => window.removeEventListener('keydown', handleKeyDown, true);
}, [readingState]);

            // Handler für das Hovern über das ganze Wort
            const handleWordEnter = useCallback((e) => {
                // Deaktiviert Popups, wenn Pacer läuft
                if (readingState === 'reading' && pacerActive) return;

                if (readingState !== 'reading' && readingState !== 'review') return;
                const target = e.currentTarget; 
                
                const devaWord = target.getAttribute('data-deva-word');
                if (devaWord) {
                    const iast = devanagariToIast(devaWord);
                    const rect = target.getBoundingClientRect();

                    const container = target.closest('.overflow-y-auto');
                    setPopup({ 
                        visible: true, 
                        // x/y relativ zum Container berechnen:
                        x: rect.left - container.getBoundingClientRect().left + container.scrollLeft - 12, 
                        y: rect.bottom - container.getBoundingClientRect().top + container.scrollTop, 
                        content: iast,
                        isSyllable: false
                    });
                }
            }, [readingState, pacerActive]);

            // Handler für den Klick/Tap auf eine Silbe (Mobile-optimiert)
            const handleSyllableClick = useCallback((e, akshara) => {
                e.stopPropagation(); 
                
                const target = e.target;
                const syllableIndex = parseInt(target.getAttribute('data-syllable-index'));
                const wordElement = target.closest('[data-deva-word]');
                const devaWord = wordElement?.getAttribute('data-deva-word');
                
                if (readingState === 'reading') {
                    if (!isNaN(syllableIndex)) finishReadingAtSyllable(syllableIndex);
                    return; 
                }

                const rect = target.getBoundingClientRect();
                const iastSyllable = devanagariToIast(akshara);
                const iastWord = devanagariToIast(devaWord || '');
                const container = target.closest('.overflow-y-auto');
                const containerRect = container.getBoundingClientRect();
                const wordRect = wordElement.getBoundingClientRect();

                // DIESE BEDINGUNG PRÜFT DIE ZUGEHÖRIGKEIT:
                // Ein Popup ist offen UND sein Inhalt (Wort oder Silbe) ist Teil des aktuell geklickten Wortes.
                const isCurrentWordActive = popup.visible && (
                    popup.content === iastWord || 
                    iastWord.includes(popup.content.replace(/[. ]/g, ''))
                );

                if (pacerActive || isCurrentWordActive) {
                    // Falls das Wort schon aktiv ist (oder Pacer läuft): Zeige Silbe
                    setPopup({ 
                        visible: true, 
                        x: Math.round(rect.left - containerRect.left + container.scrollLeft - 12),
                        y: Math.round(wordRect.bottom - containerRect.top + container.scrollTop), 
                        content: iastSyllable, 
                        isSyllable: true
                    });
                } else {
                    // NEUES WORT oder gar kein Popup: Zeige immer erst das ganze Wort
                    setPopup({ 
                        visible: true, 
                        x: Math.round(wordRect.left - containerRect.left + container.scrollLeft - 12), 
                        y: Math.round(wordRect.bottom - containerRect.top + container.scrollTop), 
                        content: iastWord,
                        isSyllable: false
                    });
                }
            }, [readingState, finishReadingAtSyllable, pacerActive, popup.visible, popup.content]);
            
            // Rendering des Textes: Zerlegt in Wörter, dann Wörter in Silben
            const renderDevaTextWithHover = (devaText) => {
                if (!devaText) return null;
                const parts = devaText.match(/(\S+|\s+|[।॥])/g) || [];
                
                let currentSyllableIndex = 0; 
                
               // Definiert das Verhalten der umschließenden Textbox
                const textContainerClass = `font-deva flex-1 overflow-y-auto transition-all text-left whitespace-pre-wrap ${
                    isTheaterMode 
                        ? 'absolute inset-0 z-[6000] pt-32 p-12 md:p-20 w-screen h-screen rounded-none border-none shadow-none m-0 bg-white dark:bg-stone-850' 
                        : 'relative p-4 border border-stone-300 dark:border-stone-600 rounded-lg dark:bg-stone-900/50'
                } text-stone-900 dark:text-stone-100 select-none ${popup.visible || (readingState === 'reading' && pacerActive) ? 'text-area-with-popup-visible' : 'cursor-help'} custom-scrollbar`;
                
                return (
                    <>
                        {/* Der Button außerhalb des Containers */}
                        <button
                            onClick={(e) => { e.stopPropagation(); setIsTheaterMode(!isTheaterMode); }}
                            className={`fixed z-[9999] w-12 h-12 flex items-center justify-center rounded-full bg-white dark:bg-stone-850 shadow-md text-stone-600 dark:text-stone-300 hover:bg-stone-100 dark:hover:bg-stone-700 transition-colors border border-stone-200 dark:border-stone-700 cursor-pointer outline-none top-3 ${
                                isTheaterMode 
                                    ? 'right-6 md:top-6' 
                                    : 'right-6 md:top-[4.5%] md:right-[calc(50%-26rem)]'
                            }`}
                            title={isTheaterMode ? "Normalansicht" : "Vollbild"}
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                {isTheaterMode ? (
                                    <path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7"/>
                                ) : (
                                    <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
                                )}
                            </svg>
                        </button>

                        <div 
                            className={`${textContainerClass} pl-8`}
                            style={{ 
                                paddingLeft: `${indent + 32}px`, 
                                paddingTop: isTheaterMode ? '120px' : '16px',
                                transition: 'padding-left 0.2s' 
                            }}
                        >
                            {popup.visible && (
                                <IASTInfoPopup 
                                    x={popup.x} 
                                    y={popup.y} 
                                    content={popup.content} 
                                    isSyllableMode={popup.isSyllable} 
                                    onClose={() => setPopup({ ...popup, visible: false })} 
                                />
                            )}
                            
                            {parts.map((part, index) => {
                                if (part.trim() === '' || part === '।' || part === '॥') {
                                    return <span key={index}>{part}</span>;
                                }

                                const aksharas = splitIntoAksharas(part);
                                return (
                                    <span
                                        key={index}
                                        className="inline-block relative isolate rounded px-1 pt-1 pb-2 transition-colors whitespace-pre-wrap hover:bg-amber-500/20 dark:hover:bg-amber-500/30 text-3xl mx-0.5"
                                        data-deva-word={part}
                                        onMouseEnter={handleWordEnter}
                                        onMouseLeave={() => setPopup({ ...popup, visible: false })}
                                    >
                                        {aksharas.map((ak, idx) => {
                                            const indexToAssign = currentSyllableIndex++;
                                            const isHighlighted = pacerActive && indexToAssign === highlightedAksharaIndex;
                                            const pacerClasses = isHighlighted ? (darkMode ? 'pacer-highlight-dark' : 'pacer-highlight-light') : '';
                                            
                                            return (
                                                <span 
                                                    key={idx}
                                                    className={`syllable-hover inline-block ${pacerClasses}`}
                                                    onClick={(e) => handleSyllableClick(e, ak)}
                                                    data-syllable-index={indexToAssign} 
                                                >
                                                    {ak}
                                                </span>
                                            );
                                        })}
                                    </span>
                                );
                            })}
                            <div className="h-4 w-full"></div>
                        </div>
                    </>
                );
            };
            
            // --- RENDERER: INPUT ---
            const renderSetup = () => (
                <div className="max-w-2xl mx-auto bg-white dark:bg-stone-800 rounded-xl shadow-lg border border-stone-200 dark:border-stone-700 mt-0 md:mt-10 flex flex-col h-[85vh] md:h-auto overflow-hidden">
                    
                    {/* Header */}
                    <div className="flex items-center p-5 md:p-8 pb-3 md:pb-3 shrink-0">
                        <button onClick={onExit} className="mr-2 text-stone-500 dark:text-stone-400 hover:text-stone-900 dark:hover:text-stone-100 transition-colors">
                            <ArrowLeft size={20} />
                        </button>
                        <h2 className="text-2xl font-bold text-stone-800 dark:text-stone-200 font-sans">
                            {TRANSLATIONS[lang].fluencyTitle}
                        </h2>
                    </div>

                    {/* Scrollbarer Bereich */}
                    <div className="flex-1 overflow-y-auto px-5 md:px-8 pb-4 custom-scrollbar">
                        <p className="text-stone-600 dark:text-stone-400 mb-4 font-sans text-sm"
                           dangerouslySetInnerHTML={{ __html: isTouch ? TRANSLATIONS[lang].introTouch : TRANSLATIONS[lang].introMouse }} />

                        <div className="space-y-4">
                            <label className="block text-sm font-bold text-stone-700 dark:text-stone-300 font-sans">
                                {TRANSLATIONS[lang].textEntryLabel}
                            </label>
                            
                            <div className="flex flex-wrap gap-2">
                                {Object.keys(SANSKRIT_SAMPLES).map(name => (
                                    <button key={name}
                                        onClick={() => {
                                            const sampleText = SANSKRIT_SAMPLES[name].text;
                                            setTextInput(textInput === sampleText ? '' : sampleText);
                                        }}
                                        className={`text-xs uppercase font-bold px-3 py-1.5 rounded-md transition-colors border shadow-sm font-sans ${
                                            textInput === SANSKRIT_SAMPLES[name].text
                                            ? 'bg-rose-100 text-rose-600 border-rose-300'
                                            : 'bg-stone-100 dark:bg-stone-700 text-stone-500 hover:bg-rose-100 hover:text-rose-600 border-stone-200 dark:border-stone-600'
                                        }`}
                                    >
                                        {TRANSLATIONS[lang].loadSample}
                                    </button>
                                ))}
                            </div>

                            {/* Dynamische Quellenangabe mit Hyperlink-Logik (REPARIERT) */}
                            {Object.values(SANSKRIT_SAMPLES).find(s => s.text === textInput)?.info && (
                                <div className="p-2 text-xs italic text-stone-500 dark:text-stone-400 bg-stone-50 dark:bg-stone-850 border-l-2 border-rose-400 rounded break-words font-sans leading-normal">
                                    {Object.values(SANSKRIT_SAMPLES).find(s => s.text === textInput).info.split(' ').map((part, i) => {
                                        if (part.startsWith('http')) {
                                            return (
                                                <a key={i} href={part.replace(/[()]/g, '')} target="_blank" className="text-rose-600 hover:underline inline-block mx-1">
                                                    {part}
                                                </a>
                                            );
                                        }
                                        return <span key={i}>{part} </span>;
                                    })}
                                </div>
                            )}

                            <textarea
                                value={textInput}
                                onChange={(e) => setTextInput(e.target.value)}
                                placeholder={TRANSLATIONS[lang].inputPlaceholder}
                                rows="6"
                                className="w-full p-3 border border-stone-300 dark:border-stone-600 rounded-lg dark:bg-stone-700 dark:text-stone-200 font-deva text-2xl focus:outline-none focus:ring-2 focus:ring-rose-500 min-h-[180px] resize-none shadow-inner"
                                maxLength={10000}
                            />

                            <div className="font-sans">
                                <button 
                                    onClick={() => setHelpExpanded(!helpExpanded)}
                                    className="w-full px-3 py-1.5 flex justify-between items-center bg-stone-100 dark:bg-stone-700 text-stone-500 hover:bg-rose-100 hover:text-rose-600 rounded-md transition-colors border border-stone-200 dark:border-stone-700 shadow-sm outline-none"
                                >
                                    <span className="font-bold uppercase text-xs">{TRANSLATIONS[lang].helpTitle}</span>
                                    <div className={`transform transition-transform ${helpExpanded ? 'rotate-180' : ''}`}>
                                        <ChevronDown size={14} />
                                    </div>
                                </button>
                                
                                {helpExpanded && (
                                    <div className="mt-2 p-4 bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded-lg text-sm text-stone-600 dark:text-stone-400">
                                        <p className="mb-3" dangerouslySetInnerHTML={{ __html: TRANSLATIONS[lang].helpIntro }} />
                                        <ul className="list-disc ml-5 space-y-2 text-xs">
                                            {/* Hyperlinks im Hilfebereich (REPARIERT) */}
                                            <li>
                                                <strong className="text-stone-700 dark:text-stone-200">{TRANSLATIONS[lang].helpConv}</strong> 
                                                <a href="https://www.aksharamukha.com/converter" target="_blank" className="text-rose-600 hover:underline ml-1">aksharamukha.com</a>
                                            </li>
                                            <li>
                                                <strong className="text-stone-700 dark:text-stone-200">{TRANSLATIONS[lang].helpOCR}</strong> 
                                                <a href="https://ocr.sanskritdictionary.com/" target="_blank" className="text-rose-600 hover:underline ml-1">ocr.sanskritdictionary.com</a>
                                            </li>                               
                                        </ul>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Sticky Footer */}
                    <div className="p-5 bg-white/90 dark:bg-stone-800/90 backdrop-blur-md border-t border-stone-100 dark:border-stone-700 shrink-0">
                        <button onClick={() => setReadingState('review')} 
                            disabled={!textInput.trim()}
                            className={`w-full bg-rose-600 hover:bg-rose-700 text-white py-4 rounded-xl font-bold shadow-lg flex justify-center items-center space-x-2 transition-all active:scale-95 ${!textInput.trim() ? 'opacity-50 cursor-not-allowed' : ''}`}
                        >
                            <span>{TRANSLATIONS[lang].showTextBtn}</span> <ArrowRight size={18} />
                        </button>
                    </div>
                </div>
            );

            // --- RENDERER: REVIEW ---
            const renderReview = () => (
                /* h-[85vh] sorgt für Stabilität auf dem Handy; overflow-hidden verhindert das Springen des Fensters */
                <div className="max-w-4xl mx-auto bg-white dark:bg-stone-800 rounded-xl shadow-lg border border-stone-200 dark:border-stone-700 mt-0 md:mt-10 flex flex-col h-[85vh] md:h-[80vh] overflow-hidden">
                    
                    {/* Header: Fest oben */}
                    <div className="flex flex-wrap items-center gap-x-4 gap-y-2 p-5 border-b border-stone-100 dark:border-stone-700 shrink-0">
                        <button onClick={() => setReadingState('input')} className="flex items-center text-stone-500 dark:text-stone-400 hover:text-stone-700 dark:hover:text-stone-200 whitespace-nowrap font-sans">
                           <ArrowLeft size={20} className="mr-1" /> {TRANSLATIONS[lang].edit}
                        </button>
                        <h2 className="text-xl font-bold text-stone-800 dark:text-stone-200 leading-tight font-sans">
                            {TRANSLATIONS[lang].reviewTitle}
                        </h2>
                    </div>
                    
                    {/* Mittlerer Bereich: Pacer-Settings und Text scrollen gemeinsam */}
					<div className="flex-1 flex flex-col p-5 md:p-8 overflow-hidden">
                        <div className="mb-6 p-4 bg-stone-50 dark:bg-stone-700/50 rounded-lg flex flex-col md:flex-row justify-between items-center space-y-3 md:space-y-0 md:space-x-4 border border-stone-200 dark:border-stone-700 font-sans">
                            <label className="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" checked={pacerActive} onChange={(e) => setPacerActive(e.target.checked)}
                                    className="w-5 h-5 text-rose-600 bg-white border-stone-300 rounded focus:ring-rose-500 dark:bg-stone-600 dark:border-stone-500"
                                />
                                <span className="font-semibold text-stone-700 dark:text-stone-300">{TRANSLATIONS[lang].pacerEnable}</span>
                            </label>

                            <div className="flex items-center space-x-2" title={TRANSLATIONS[lang].spmFull}>
                                <label htmlFor="pacer-speed" className="text-sm text-stone-600 dark:text-stone-400 whitespace-nowrap">
                                    {TRANSLATIONS[lang].target}
                                    <span className="cursor-help border-b border-dashed border-stone-400 dark:border-stone-500">SPM</span>:
                                </label>
                                <input id="pacer-speed" type="number" value={pacerSpeed}
                                    onChange={(e) => {
                                        const val = e.target.value;
                                        if (val === '') { setPacerSpeed(''); return; }
                                        const num = parseInt(val, 10);
                                        if (!isNaN(num)) setPacerSpeed(Math.min(600, num));
                                    }}
                                    onBlur={() => { if (pacerSpeed === '' || pacerSpeed < 1) setPacerSpeed(1); }}
                                    min="1" max="600" disabled={!pacerActive}
                                    className={`w-20 p-1 border rounded-lg text-center font-mono focus:ring-2 focus:ring-rose-500 ${!pacerActive ? 'bg-stone-200 dark:bg-stone-700/50 text-stone-400' : 'bg-white dark:bg-stone-800 text-stone-800 dark:text-stone-200 border-stone-300 dark:border-stone-600'}`}
                                />
                            </div>
                        </div>
                        
                        {renderDevaTextWithHover(devaOutput)}
                        <div className="h-4"></div> {/* Abstandshalter am Ende */}
                    </div>

                    {/* Sticky Footer: Button fest unten */}
                    <div className="p-5 bg-white/95 dark:bg-stone-800/95 backdrop-blur-md border-t border-stone-100 dark:border-stone-700 shrink-0 text-center shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                        <p className="text-[10px] uppercase tracking-wider text-stone-400 mb-2 font-sans">{TRANSLATIONS[lang].readyNote}</p>
                        <button onClick={startReading} className="w-full max-w-md mx-auto bg-rose-600 hover:bg-rose-700 text-white py-4 rounded-xl font-bold shadow-lg flex justify-center items-center space-x-2 transition-all active:scale-95">
                            <span>{TRANSLATIONS[lang].calcSpeedBtn}</span> <ClockIcon size={18} />
                        </button>
                    </div>
                </div>
            );
            
            // --- RENDERER: READING ---
            const renderReading = () => (
                /* Feste Höhe (h-[85vh] / md:h-[80vh]) erzwingt, dass der Button unten im Kasten bleibt */
                <div className="max-w-4xl mx-auto bg-white dark:bg-stone-800 rounded-xl shadow-lg border border-stone-200 dark:border-stone-700 mt-0 md:mt-10 flex flex-col h-[85vh] md:h-[80vh] overflow-hidden">
                    
                    {/* Header: Fest oben */}
