        const handleDevaNext = useCallback(() => {
            if (devaMode === 'quiz' && !quizAnswered) return;

            if (devaIndex < devaItems.length - 1) {
                setIsAnimating(false);
                setShowCardBack(false);

                const nextIdx = devaIndex + 1;
                setDevaIndex(nextIdx);

                if (devaMode === 'quiz') {
                    setQuizAnswered(false);
                    setQuizSelection(null);
                    setQuizFocusIndex(-1);
                    const nextOptions = generateQuizOptions(devaItems[nextIdx], devaItems);
                    setQuizOptions(nextOptions);
                }

                setTimeout(() => { setIsAnimating(true); }, 50);
            } else {
                setAppState('setup_devanagari');
            }

            if (document.activeElement) document.activeElement.blur();
        }, [devaIndex, devaItems, devaMode, quizAnswered]);

        const handleDevaPrev = useCallback(() => {
            if (devaIndex > 0) {
                setIsAnimating(false);
                setShowCardBack(false);

                const prevIdx = devaIndex - 1;
                setDevaIndex(prevIdx);

                if (devaMode === 'quiz') {
                    setQuizAnswered(false);
                    setQuizSelection(null);
                    setQuizFocusIndex(-1);
                    const prevOptions = generateQuizOptions(devaItems[prevIdx], devaItems);
                    setQuizOptions(prevOptions);
                }

                setTimeout(() => { setIsAnimating(true); }, 50);
            }
        }, [devaIndex, devaItems, devaMode]);

          // --- EFFECTS ---
          useEffect(() => {
              if (darkMode) {
                  document.documentElement.classList.add('dark');
              } else {
                  document.documentElement.classList.remove('dark');
              }
          }, [darkMode]);

          useEffect(() => {
              localStorage.setItem('sanskrit_app_lang', lang);
          }, [lang]);
		  
		  useEffect(() => {
              const urlParams = new URLSearchParams(window.location.search);
              const codeToLoad = urlParams.get('load');
              
              if (codeToLoad) {
                  setTimeout(async () => {
                      const success = await window.importCollectionWithId(codeToLoad);
                      if (success) {
                          const newUrl = window.location.pathname;
                          window.history.replaceState({}, document.title, newUrl);
                          
                          alert(lang === 'de'
                              ? `🎉 Online-Sammlung erfolgreich importiert:\n"${success.name_de || success.filename}"`
                              : `🎉 Online collection successfully imported:\n"${success.name_en || success.filename}"`
                          );
                      }
                  }, 800);
              }
          }, []);

		  const handleQuizAnswer = useCallback((option) => {
			if (quizAnswered) return;
			const currentItem = devaItems[devaIndex];
			if (!currentItem) return;
			
			// Absolut eindeutiger Vergleich über beide Felder, um leere Textfelder bei Bildern abzufangen
			const isCorrect = option.t === currentItem.t && option.d === currentItem.d;
			
			// Wir speichern die IAST-Transliteration der gewählten Option zur Identifikation
			setQuizSelection(option.t);
			setQuizAnswered(true);
			if (isCorrect) setQuizScore(prev => prev + 1);
		}, [quizAnswered, devaItems, devaIndex]);

          useEffect(() => {
            const handleKeyDown = (e) => {
                // Erweitert um ArrowUp und ArrowDown für die vertikale Gittersteuerung
                const navKeys = ['Escape', 'Enter', 'ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown'];
                if (!navKeys.includes(e.key)) return;

                // Falls wir in der Session sind, verhindern wir Standard-Browser-Aktionen
                if (appState === 'devanagari_session' && !studyModeContent && !showCustomEditor && !showInfo && !showFontSettings) {
                    if (e.key !== 'Escape') e.preventDefault(); 
                }

                // 1. PRIORITÄT: OVERLAYS (MODALE) SCHLIESSEN
                if (e.key === 'Escape') {
                    if (studyModeContent) { setStudyModeContent(null); return; }
                    if (showCustomEditor) { setShowCustomEditor(false); return; }
                    if (showInfo) { setShowInfo(false); return; }
                    if (showFontSettings) { setShowFontSettings(false); return; }
                }

                // 2. PRIORITÄT: NAVIGATION INNERHALB DER APP-STATES
                if (appState === 'devanagari_session') {
                    if (e.key === 'Escape') {
                        setAppState('setup_devanagari');
                        return;
                    }

                    if (devaMode === 'cards') {
                        if (e.key === 'Enter') setShowCardBack(prev => !prev);
                        else if (e.key === 'ArrowRight') handleDevaNext();
                        else if (e.key === 'ArrowLeft') handleDevaPrev();
                    } else if (devaMode === 'quiz') {
                        if (quizAnswered) {
                            if (e.key === 'Enter') handleDevaNext();
                        } else {
                            if (quizFocusIndex === -1) {
                                if (e.key === 'ArrowDown') {
                                    if (quizOptions.length > 2) setQuizFocusIndex(2);
                                    else setQuizFocusIndex(0);
                                } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                                    setQuizFocusIndex(0);
                                } else if (e.key === 'ArrowRight') {
                                    if (quizOptions.length > 1) setQuizFocusIndex(1);
                                    else setQuizFocusIndex(0);
                                }
                            } else {
                                if (e.key === 'ArrowRight') {
                                    if (quizFocusIndex === 0 && quizOptions.length > 1) setQuizFocusIndex(1);
                                    else if (quizFocusIndex === 2 && quizOptions.length > 3) setQuizFocusIndex(3);
                                } else if (e.key === 'ArrowLeft') {
                                    if (quizFocusIndex === 1) setQuizFocusIndex(0);
                                    else if (quizFocusIndex === 3) setQuizFocusIndex(2);
                                } else if (e.key === 'ArrowDown') {
                                    if (quizFocusIndex === 0 && quizOptions.length > 2) setQuizFocusIndex(2);
                                    else if (quizFocusIndex === 1 && quizOptions.length > 3) setQuizFocusIndex(3);
                                } else if (e.key === 'ArrowUp') {
                                    if (quizFocusIndex === 2) setQuizFocusIndex(0);
                                    else if (quizFocusIndex === 3) setQuizFocusIndex(1);
                                } else if (e.key === 'Enter') {
                                    if (quizOptions[quizFocusIndex]) {
                                        handleQuizAnswer(quizOptions[quizFocusIndex]);
                                    }
                                }
                            }
                        }
                    }
                    return;
                } 
                
                if (appState === 'setup_devanagari') {
                    if (e.key === 'Escape' || e.key === 'ArrowLeft') {
                        setAppState('home');
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        startDevanagari();
                    }
                }
            };

            const handleMouseMove = (e) => {
                if (isTheaterMode && e.clientY < 100) {
                    triggerHeader();
                }
            };

            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('mousemove', handleMouseMove);
            
            return () => {
                window.removeEventListener('keydown', handleKeyDown);
                window.removeEventListener('mousemove', handleMouseMove);
            };
        }, [appState, devaMode, quizAnswered, quizFocusIndex, quizOptions, handleDevaNext, handleDevaPrev, handleQuizAnswer, studyModeContent, showCustomEditor, showInfo, showFontSettings, isTheaterMode]);

          // Popup-Click-Handler (separat für Maus-Events)
          useEffect(() => {
              const closePopup = () => setPopup(p => ({ ...p, visible: false }));
              if (popup.visible) window.addEventListener('click', closePopup);
              return () => window.removeEventListener('click', closePopup);
          }, [popup.visible]);

          // Berechnet die Gesamtzahl aller aktiven Pakete (Standard + Eigene)
          const totalActiveSets = useMemo(() => {
              const standardCount = devaSet.filter(s => s !== 'custom').length;
              const customCount = devaSet.includes('custom') 
                  ? customCategories.filter(c => c.active).length 
                  : 0;
              return standardCount + customCount;
          }, [devaSet, customCategories]);

          {/* ORDER_LOGIC_SYNC */}
          const showHelp = (e, title, description) => {
              // Verhindert Hover-Effekte auf Mobile-Browsern
              if (e.type === 'mouseenter' && window.matchMedia("(pointer: coarse)").matches) return;
              
              const rect = e.currentTarget.getBoundingClientRect();
              setPopup({
                  visible: true,
                  x: rect.right + 10,
                  y: rect.top + (rect.height / 2),
                  content: { word: title, def: description }
              });
          };

          const cancelHelp = () => {
              if (longPressTimer.current) clearTimeout(longPressTimer.current);
              setPopup(prev => ({ ...prev, visible: false }));
          };
		  useEffect(() => {
              if (totalActiveSets > 1 && devaOrder === 'sequential') {
                  setDevaOrder('random');
              }
          }, [totalActiveSets, devaOrder]);

          const [activeAnimation, setActiveAnimation] = useState(null);
		  {/* DYNAMIC_FONT_LOADER */}
        useEffect(() => {
            const uniqueFonts = new Set();
            
            // Fallback-Logik. Wenn customFontName leer ist, nutze Standardnamen.
            const defaultFontFile = 'Sanskrit2003 - 30.07.2019.otf';
            const baseFont = customFontName.trim() || defaultFontFile;
            
            uniqueFonts.add(baseFont);
            if (baseFont !== defaultFontFile) uniqueFonts.add(defaultFontFile);
            
            customCategories.forEach(cat => {
                if (cat.font) uniqueFonts.add(cat.font);
                if (cat.items) {
                    cat.items.forEach(item => {
                        if (item.font) uniqueFonts.add(item.font);
                    });
                }
            });

            let fontStyles = '';
            uniqueFonts.forEach(fontFile => {
                const trimmed = fontFile.trim();
                if (trimmed !== "") {
                    fontStyles += `
                        @font-face {
                            font-family: "${trimmed}";
                            src: url("${encodeURI(trimmed)}") format("opentype"), 
                                 url("${encodeURI(trimmed)}") format("truetype");
                            font-display: swap;
                        }
                    `;
                }
            });

            fontStyles += `
                .font-deva { 
                    font-family: "${baseFont}", "Sanskrit2003", serif; 
                }
            `;
            
            const oldStyle = document.getElementById('dynamic-font-style');
            if (oldStyle) oldStyle.remove();
            
const styleEl = document.createElement('style');
            styleEl.id = 'dynamic-font-style';
            styleEl.innerHTML = fontStyles;
            document.head.appendChild(styleEl);
        }, [customFontName, customCategories]);
          
        // Popup-Click-Handler (separat für Maus-Events)
        useEffect(() => {
            const closePopup = () => setPopup(p => ({ ...p, visible: false }));
            if (popup.visible) window.addEventListener('click', closePopup);
            return () => window.removeEventListener('click', closePopup);
        }, [popup.visible]);

        // --- DEVANAGARI LOGIC ---

          const generateQuizOptions = (correctItem, allItems) => {
              // Set-Isolation: Nur Zeichen aus derselben Quelle
              const categoryPool = allItems.filter(it => it.catSource === correctItem.catSource);
              const otherItems = categoryPool.filter(it => it.t !== correctItem.t);
              
              let distractors = [];

              // 1. "Smarte" Distraktoren suchen
              if (SMART_DISTRACTORS[correctItem.t]) {
                  const similarKeys = SMART_DISTRACTORS[correctItem.t];
                  distractors = otherItems.filter(it => similarKeys.includes(it.t));
              }

              // Falls wir hier schon mehr als 3 haben (wie bei "ya"), 
              // kürzen wir sie hier direkt auf 3 zufällige aus der Auswahl.
              if (distractors.length > 3) {
                  distractors = shuffleArray(distractors).slice(0, 3);
              }

              // 2. Auffüllen, falls wir noch weniger als 3 haben
              const needed = 3 - distractors.length;
              if (needed > 0) {
                  const remaining = otherItems.filter(it => !distractors.some(d => d.t === it.t));
                  const randomFillers = shuffleArray(remaining).slice(0, Math.min(needed, remaining.length));
                  distractors = [...distractors, ...randomFillers];
              }

              // Jetzt sind es garantiert 1 korrektes + maximal 3 falsche = max 4 Buttons
              return shuffleArray([correctItem, ...distractors]);
          };

          const toggleDevaSet = (set) => {
              setDevaSet(prev => {
                  if (prev.includes(set)) {
                      if (prev.length === 1) return prev;
                      return prev.filter(s => s !== set);
                  }
                  return [...prev, set];
              });
          };

          const startDevanagari = () => {
              let combinedItems = [];
              
              // Standard-Sets hinzufügen
              devaSet.forEach(set => {
                  if (DEVANAGARI_DATA[set]) {
                      DEVANAGARI_DATA[set].forEach(item => {
                          combinedItems.push({ 
                              d: item.d, 
                              t: item.t, 
                              font: '', 
                              image: null,
                              note: null,
                              catSource: set // Herkunft speichern
                          });
                      });
                  }
              });

              // Eigene Zeichen hinzufügen (erweitert um rekursive Ordner-Suche)
              if (devaSet.includes('custom')) {
                  const processCollection = (cat) => {
                      if (!cat.active) return;
                      const effectiveFont = cat.font || '';
                      if (cat.items) {
                          cat.items.forEach(item => {
                              combinedItems.push({ 
                                  d: item.char || '', 
                                  t: item.iast || '', 
                                  font: item.font || effectiveFont,
                                  image: item.image || null,
                                  note: item.note || null,
                                  catSource: cat.id
                              });
                          });
                      }
                  };

                  customCategories.forEach(cat => {
                      if (cat.isFolder) {
                          // Unabhängig vom Ordner-Haken: Verarbeite jede Unter-Sammlung, die einzeln aktiv ist
                          if (cat.collections) {
                              cat.collections.forEach(subCat => {
                                  processCollection(subCat);
                              });
                          }
                      } else {
                          // Normale Sammlung auf Wurzelebene
                          processCollection(cat);
                      }
                  });
              }

              if (combinedItems.length === 0) return;

              const finalItems = devaOrder === 'random' ? shuffleArray(combinedItems) : combinedItems;
              setDevaItems(finalItems);
              setDevaIndex(0);
              setQuizScore(0);
              setQuizAnswered(false);
              setQuizSelection(null);
              
              if (devaMode === 'quiz') {
                  setQuizOptions(generateQuizOptions(finalItems[0], finalItems));
              }
              
              setAppState('devanagari_session');
          };

          // --- RENDERERS ---
          const renderHeader = () => {
              const isHome = appState === 'home';
              const isShown = isHome || headerVisible;

              // Handy-Logik: Icons für 2 Sek. einblenden
              const handleHeaderTap = () => {
                  if (isHome) return;
                  setHeaderVisible(true);
                  if (headerTimerRef.current) clearTimeout(headerTimerRef.current);
                  headerTimerRef.current = setTimeout(() => setHeaderVisible(false), 2000);
              };

              return (
                  <div 
                    {...(!isHome ? {
                        onMouseEnter: () => setHeaderVisible(true),
                        onMouseLeave: () => setHeaderVisible(false),
                        onClick: handleHeaderTap
                    } : {})}
                    className={`${isHome 
                        ? 'w-full flex justify-center items-center gap-3 mb-8 transition-none' 
                        : `fixed top-0 left-0 right-0 h-16 pt-2 md:h-28 md:pt-8 flex justify-center items-center gap-3 transition-opacity duration-500 ${
							document.querySelector('[data-fluency-theater="true"]') ? 'z-[6500]' : 'z-[9000]'
						 }`
                        } ${isShown ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-auto'}`}
                  >
                      {/* Sprach-Umschalter */}
                      <div className="relative inline-block text-left" onClick={(e) => e.stopPropagation()}>
                          <select 
                              value={lang}
                              onChange={(e) => { setLang(e.target.value); if (!isHome) handleHeaderTap(); }}
                              className="appearance-none w-12 h-12 text-center rounded-full bg-white dark:bg-stone-800 shadow-md text-stone-600 dark:text-stone-300 hover:bg-stone-100 dark:hover:bg-stone-700 transition-colors border border-stone-200 dark:border-stone-700 font-bold text-sm cursor-pointer outline-none p-0"
                              style={{ pointerEvents: isShown ? 'auto' : 'none' }}
                          >
                              <option value="de">DE</option>
                              <option value="en">EN</option>
                          </select>
                      </div>

                      {/* Info Button */}
                      <button 
                        onClick={(e) => { e.stopPropagation(); setShowInfo(true); if (!isHome) handleHeaderTap(); }}
                        style={{ pointerEvents: isShown ? 'auto' : 'none' }}
                        className="w-12 h-12 flex items-center justify-center rounded-full bg-white dark:bg-stone-800 shadow-md text-stone-600 dark:text-stone-300 hover:bg-stone-100 dark:hover:bg-stone-700 transition-colors font-serif italic font-bold text-xl border border-stone-200 dark:border-stone-700"
                      >
                        i
                      </button>

                      {/* Fullscreen Button */}
                      <button 
                        onClick={(e) => { 
                            e.stopPropagation();
                            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
                            else if (document.exitFullscreen) document.exitFullscreen();
                            if (!isHome) handleHeaderTap();
                        }}
                        style={{ pointerEvents: isShown ? 'auto' : 'none' }}
                        className="w-12 h-12 flex items-center justify-center rounded-full bg-white dark:bg-stone-800 shadow-md text-stone-600 dark:text-stone-300 hover:bg-stone-100 dark:hover:bg-stone-700 transition-colors border border-stone-200 dark:border-stone-700"
                      >
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
                      </button>

                      {/* Dark Mode Button */}
                      <button 
                        onClick={(e) => { e.stopPropagation(); setDarkMode(!darkMode); if (!isHome) handleHeaderTap(); }}
                        style={{ pointerEvents: isShown ? 'auto' : 'none' }}
                        className="w-12 h-12 flex items-center justify-center rounded-full bg-white dark:bg-stone-800 shadow-md text-stone-600 dark:text-stone-300 hover:bg-stone-100 dark:hover:bg-stone-700 transition-colors border border-stone-200 dark:border-stone-700"
                      >
                          {darkMode ? <Sun size={20} /> : <Moon size={20} />}
                      </button>
                  </div>
              );
          };

          const renderHome = () => (
            <div className="space-y-6 text-center p-4 pt-6 md:pt-24 max-w-5xl mx-auto flex flex-col items-center">
              <div className="mb-8 text-center w-full">

					  {TRANSLATIONS[lang].appSubtitle}

              <div className="flex justify-center">
                <button 
                  onClick={() => { setActiveTopic('devanagari'); setAppState('setup_devanagari'); }}
                  className="group p-8 bg-white dark:bg-stone-800 rounded-xl border-2 border-stone-200 dark:border-stone-700 hover:border-rose-500 dark:hover:border-rose-500 hover:bg-rose-50 dark:hover:bg-stone-750 transition-all shadow-lg flex flex-col items-center w-64"
                >
                  <div className="mb-6 text-rose-600 group-hover:scale-110 transition-transform flex items-center justify-center h-16">
                    <OmIcon size={48} />
                  </div>
                  <h2 className="text-2xl font-bold text-stone-800 dark:text-stone-200 mb-2">Devanāgarī</h2>
                  <p className="text-stone-500 dark:text-stone-400">
                    {TRANSLATIONS[lang].startPractice}
                  </p>
                </button>
              </div>
            </div>
          );
          const renderPlaceholder = () => (
            <div className="max-w-lg mx-auto bg-white dark:bg-stone-800 p-8 rounded-xl shadow-lg border border-stone-200 dark:border-stone-700 mt-10 text-center">
                <h2 className="text-2xl font-bold mb-4">
                  {TRANSLATIONS[lang].readTexts}
                </h2>
                <p className="text-stone-500 mb-6">
                    {lang === 'de' 
                      ? "Hier wird das Modul zum Lesen von Texten integriert." 
                      : "The module for reading texts will be integrated here."}
                </p>
                <button 
                  onClick={() => setAppState('setup_devanagari')} 
                  className="bg-rose-600 text-white px-6 py-2 rounded-lg font-bold"
                >
                  {TRANSLATIONS[lang].back}
                </button>
            </div>
          );
const renderDevanagariSetup = () => (
            <div className="max-w-lg mx-auto bg-white dark:bg-stone-800 pt-6 px-5 pb-5 md:p-8 rounded-xl shadow-lg border border-stone-200 dark:border-stone-700 mt-0 md:mt-10">
                <div className="flex items-center justify-center mb-6 relative min-h-[40px]">
					<button 
						onClick={() => setAppState('home')} 
						className="absolute left-0 text-stone-500 dark:text-stone-400 hover:text-stone-900 dark:hover:text-stone-100 transition-colors"
					>
						<ArrowLeft size={20} />
					</button>
					<h2 className="text-2xl font-bold text-stone-800 dark:text-stone-200 text-center">
						{TRANSLATIONS[lang].setupTitle}

					<button 
						onClick={() => setShowFontSettings(true)}
						className="absolute right-0 p-2 hover:bg-stone-100 dark:hover:bg-stone-700 rounded-full text-stone-400 hover:text-rose-600 transition-colors"

						<SettingsIcon size={18} />

				</div>

                <div className="space-y-3">
                    <div>

                        </div>
                       <div className="grid grid-cols-1 gap-2">

                                <span className="font-bold py-1 select-none cursor-help" onMouseEnter={(e) => showHelp(e, TRANSLATIONS[lang].catBasic, TRANSLATIONS[lang].catBasicDesc)} onMouseLeave={cancelHelp} onClick={(e) => { e.stopPropagation(); showHelp(e, TRANSLATIONS[lang].catBasic, TRANSLATIONS[lang].catBasicDesc); }}>{TRANSLATIONS[lang].catBasic}</span>

                                <div className="flex-1 h-8"></div>
                                <span onClick={(e) => { e.stopPropagation(); setStudyModeContent('diacritics'); }} className="text-xl font-deva opacity-80 select-none ml-4 w-10 text-center hover:text-rose-600 hover:scale-125 transition-all cursor-zoom-in" title={TRANSLATIONS[lang].viewMode}>सि</span>
                            </button>

                            {/* Ligaturen */}
                            <button onClick={() => toggleDevaSet('ligatures')} className={`p-2 px-4 text-left border rounded-lg flex justify-between items-center transition-all ${devaSet.includes('ligatures') ? 'border-rose-500 bg-rose-50 dark:bg-rose-900/20 text-rose-900 dark:text-rose-300' : 'border-stone-200 dark:border-stone-600 text-stone-600 dark:text-stone-300 hover:bg-stone-50 dark:hover:bg-stone-700'}`}>
                                <span className="font-bold py-1 select-none cursor-help" onMouseEnter={(e) => showHelp(e, TRANSLATIONS[lang].catLigatures, TRANSLATIONS[lang].catLigaturesDesc)} onMouseLeave={cancelHelp} onClick={(e) => { e.stopPropagation(); showHelp(e, TRANSLATIONS[lang].catLigatures, TRANSLATIONS[lang].catLigaturesDesc); }}>{TRANSLATIONS[lang].catLigatures}</span>
                                <div className="flex-1 h-8"></div>
                                <span onClick={(e) => { e.stopPropagation(); setStudyModeContent('ligatures'); }} className="text-2xl font-deva opacity-80 select-none ml-4 w-10 text-center hover:text-rose-600 hover:scale-125 transition-all cursor-zoom-in" title={TRANSLATIONS[lang].viewMode}>ष्ठ</span>
                            </button>

                            {/* Ziffernzeichen */}
                            <button onClick={() => toggleDevaSet('digits')} className={`p-2 px-4 text-left border rounded-lg flex justify-between items-center transition-all ${devaSet.includes('digits') ? 'border-rose-500 bg-rose-50 dark:bg-rose-900/20 text-rose-900 dark:text-rose-300' : 'border-stone-200 dark:border-stone-600 text-stone-600 dark:text-stone-300 hover:bg-stone-50 dark:hover:bg-stone-700'}`}>
                                <span className="font-bold py-1 select-none cursor-help" onMouseEnter={(e) => showHelp(e, TRANSLATIONS[lang].catDigits, TRANSLATIONS[lang].catDigitsDesc)} onMouseLeave={cancelHelp} onClick={(e) => { e.stopPropagation(); showHelp(e, TRANSLATIONS[lang].catDigits, TRANSLATIONS[lang].catDigitsDesc); }}>{TRANSLATIONS[lang].catDigits}</span>
                                <div className="flex-1 h-8"></div>
                                <span onClick={(e) => { e.stopPropagation(); setStudyModeContent('digits'); }} className="text-2xl font-deva opacity-80 select-none ml-4 w-10 text-center hover:text-rose-600 hover:scale-125 transition-all cursor-zoom-in" title={TRANSLATIONS[lang].viewMode}>७</span>
                            </button>

                            {/* Eigene Zeichen */}
                            <button onClick={() => toggleDevaSet('custom')} className={`p-2 px-4 text-left border-2 border-dashed rounded-lg flex justify-between items-center transition-all group ${devaSet.includes('custom') ? 'border-rose-500 bg-rose-50 dark:bg-rose-900/20 text-rose-900 dark:text-rose-300' : 'border-rose-200 dark:border-rose-900/40 text-stone-600 dark:text-stone-300 hover:bg-stone-50 dark:hover:bg-stone-700'}`}>
                                <div 
                                    className="py-1 select-none cursor-help" 
                                    onMouseEnter={(e) => {
                                        // Rekursive Ermittlung aller wirklich aktiven Sammlungen für den Tooltip
                                        const getActiveCollectionNames = (list) => {
                                            let names = [];
                                            list.forEach(c => {
                                                if (c.isFolder && c.collections) {
                                                    names = [...names, ...getActiveCollectionNames(c.collections)];
                                                } else if (!c.isFolder && c.active) {
                                                    names.push(c.name);
                                                }
                                            });
                                            return names;
                                        };
                                        const activeNamesList = getActiveCollectionNames(customCategories);
                                        const activeNames = activeNamesList.join("; ");
                                        showHelp(e, lang === 'de' ? "Eigene Zeichen" : "Custom characters", activeNames ? TRANSLATIONS[lang].catCustomActive + activeNames : TRANSLATIONS[lang].catCustomNone);
                                    }} 
                                    onMouseLeave={cancelHelp} 
                                    onClick={(e) => { 
                                        e.stopPropagation(); 
                                        const getActiveCollectionNames = (list) => {
                                            let names = [];
                                            list.forEach(c => {
                                                if (c.isFolder && c.collections) {
                                                    names = [...names, ...getActiveCollectionNames(c.collections)];
                                                } else if (!c.isFolder && c.active) {
                                                    names.push(c.name);
                                                }
                                            });
                                            return names;
                                        };
                                        const activeNamesList = getActiveCollectionNames(customCategories);
                                        const activeNames = activeNamesList.join("; ");
                                        showHelp(e, lang === 'de' ? "Eigene Zeichen" : "Custom characters", activeNames ? TRANSLATIONS[lang].catCustomActive + activeNames : TRANSLATIONS[lang].catCustomNone);
                                    }}
                                >
                                    <span className={`font-bold ${devaSet.includes('custom') ? 'text-rose-700 dark:text-rose-400' : 'text-stone-700 dark:text-stone-300'}`}>
                                        {TRANSLATIONS[lang].catCustom}
                                    </span> 
                                </div>
                                <div className="flex-1 h-8"></div>
                                <div className="w-10 ml-4 flex justify-center">
                                    <div onClick={(e) => { e.stopPropagation(); cancelHelp(); setShowCustomEditor(true); }} className="p-1.5 text-stone-400 hover:text-rose-600 hover:bg-white dark:hover:bg-stone-800 rounded-full transition-all border border-transparent hover:border-rose-200 shadow-sm cursor-pointer">
                                        <SettingsIcon size={16} />
                                    </div>
                                </div>
                            </button>
                        </div>
                    </div>

                    <div className="flex space-x-4">
                        <div className="flex-1">
                            <label className="block text-sm font-bold text-stone-700 dark:text-stone-300 mb-2">{TRANSLATIONS[lang].mode}</label>
                            <div className="flex bg-stone-100 dark:bg-stone-900 p-1 rounded-lg">
                                <button onClick={() => setDevaMode('quiz')} className={`flex-1 py-2 text-sm rounded-md ${devaMode === 'quiz' ? 'bg-white dark:bg-stone-800 shadow text-rose-700 dark:text-rose-400' : 'text-stone-500 dark:text-stone-400'}`}>{TRANSLATIONS[lang].quiz}</button>
                                <button onClick={() => setDevaMode('cards')} className={`flex-1 py-2 text-sm rounded-md ${devaMode === 'cards' ? 'bg-white dark:bg-stone-800 shadow text-rose-700 dark:text-rose-400' : 'text-stone-500 dark:text-stone-400'}`}>{TRANSLATIONS[lang].flashcards}</button>
                            </div>
                        </div>
                        <div className="flex-1">
                            <label className="block text-sm font-bold text-stone-700 dark:text-stone-300 mb-2">{TRANSLATIONS[lang].order}</label>
                            <div className="flex bg-stone-100 dark:bg-stone-900 p-1 rounded-lg">
                                <button 
                                    onClick={() => setDevaOrder('sequential')} 
                                    disabled={totalActiveSets > 1}
                                    title={totalActiveSets > 1 ? TRANSLATIONS[lang].seqNote : ""}
                                    className={`flex-1 py-2 text-sm rounded-md transition-all ${
                                        devaOrder === 'sequential' 
                                        ? 'bg-white dark:bg-stone-800 shadow text-rose-700 dark:text-rose-400 font-bold' 
                                        : 'text-stone-500 dark:text-stone-400'
                                    } ${totalActiveSets > 1 ? 'opacity-30 cursor-not-allowed' : ''}`}
                                >
                                    {TRANSLATIONS[lang].sequential}
                                </button>
                                <button onClick={() => setDevaOrder('random')} className={`flex-1 py-2 text-sm rounded-md ${devaOrder === 'random' ? 'bg-white dark:bg-stone-800 shadow text-rose-700 dark:text-rose-400 font-bold' : 'text-stone-500 dark:text-stone-400'}`}>{TRANSLATIONS[lang].random}</button>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label className="block text-sm font-bold text-stone-700 dark:text-stone-300 mb-2">{TRANSLATIONS[lang].direction}</label>
                        <div className="flex bg-stone-100 dark:bg-stone-900 p-1 rounded-lg">
                            <button onClick={() => setDevaDirection('devaToIast')} className={`flex-1 py-2 text-sm rounded-md transition-all ${devaDirection === 'devaToIast' ? 'bg-white dark:bg-stone-800 shadow text-rose-700 dark:text-rose-400 font-bold' : 'text-stone-500 dark:text-stone-400'}`}>अ → a</button>
                            <button onClick={() => setDevaDirection('iastToDeva')} className={`flex-1 py-2 text-sm rounded-md transition-all ${devaDirection === 'iastToDeva' ? 'bg-white dark:bg-stone-800 shadow text-rose-700 dark:text-rose-400 font-bold' : 'text-stone-500 dark:text-stone-400'}`}>a → अ</button>
                        </div>
                    </div>
                </div>

                <button onClick={startDevanagari} className="w-full bg-rose-600 hover:bg-rose-700 text-white py-3 rounded-lg font-bold shadow-md mt-6 flex justify-center items-center space-x-2">
                    <span>{TRANSLATIONS[lang].start}</span> <ArrowRight size={18} />
                </button>
            </div>
          );

const renderDevanagariSession = () => {
            const getCategoryLabel = (source) => {
                const standardNames = {
                    basic: TRANSLATIONS[lang].catBasic,
                    diacritics: TRANSLATIONS[lang].catDiacritics,
                    ligatures: TRANSLATIONS[lang].catLigatures,
                    digits: TRANSLATIONS[lang].catDigits
                };
                if (standardNames[source]) return standardNames[source];
                
                // 1. Suche auf der Hauptebene
                const customCat = customCategories.find(c => c.id === source);
                if (customCat) return customCat.name;

                // 2. Suche tiefen-basiert innerhalb der Ordner-Strukturen
                for (let cat of customCategories) {
                    if (cat.isFolder && cat.collections) {
                        const subCat = cat.collections.find(sub => sub.id === source);
                        if (subCat) return subCat.name; // Nur den Sammlungsnamen zurückgeben
                    }
                }
                return '';
            };

            const currentItem = devaItems[devaIndex];
            const categoryLabel = getCategoryLabel(currentItem?.catSource);
            const isLastCard = devaIndex === devaItems.length - 1;
            const isForward = devaDirection === 'devaToIast';

            const displayQuestion = isForward ? currentItem?.d : currentItem?.t;
            const displayAnswer = isForward ? currentItem?.t : currentItem?.d;

            if (devaMode === 'cards') {
				return (
					<div className="max-w-md mx-auto mt-0 md:mt-32">
                        <div className="flex justify-between items-center mb-2">
                            <button 
                                onClick={() => setAppState('setup_devanagari')} 
                                className="text-stone-500 dark:text-stone-400 hover:text-stone-900 dark:hover:text-stone-100 transition-colors"
                            >
                                <ArrowLeft size={24} />
                            </button>
                            <div className="text-sm font-medium text-stone-500">{devaIndex + 1} / {devaItems.length}</div>
                            <div className="w-10"></div>
                        </div>
                        
                        {/* Kategorie-Label */}
                        <div className="text-center mb-4">
							<span className="text-xs uppercase tracking-widest text-stone-400 font-semibold text-center block w-full">
								{categoryLabel}
							</span>
						</div>

                        <TrainerCard 
                            lang={lang}
                            front={displayQuestion} 
                            back={displayAnswer} 
                            showBack={showCardBack} 
                            setShowBack={setShowCardBack} 
                            isAnimating={isAnimating}
                            frontLang={isForward ? 'deva' : 'iast'}
                            backLang={isForward ? 'iast' : 'deva'}
                            themeColor="rose"
                            isTouch={isTouch}
                            customFont={currentItem?.font}
                            frontImage={isForward ? currentItem?.image : null}
                            backImage={!isForward ? currentItem?.image : null}
                            note={currentItem?.note}
                            onInfoClick={showHelp}
                        />

                        <div className="flex gap-4 mt-12">
                            <button onClick={handleDevaPrev} disabled={devaIndex === 0} className="flex-1 py-4 bg-white dark:bg-stone-850 rounded-2xl shadow-md disabled:opacity-50 flex items-center justify-center gap-2 text-stone-600 dark:text-stone-400">
                                <ArrowLeft size={20} /> {TRANSLATIONS[lang].back}
                            </button>
                            <button onClick={handleDevaNext} className="flex-1 py-4 bg-rose-600 hover:bg-rose-700 text-white rounded-2xl shadow-md flex items-center justify-center gap-2 font-bold">
                                {isLastCard ? TRANSLATIONS[lang].finish : TRANSLATIONS[lang].next} <ArrowRight size={20} />
                            </button>
                        </div>
                    </div>
                );
            }

            return (
				<div className="max-w-md mx-auto mt-0 md:mt-32">
                    <div className="flex justify-between items-center mb-8">
                        <button 
                            onClick={() => setAppState('setup_devanagari')} 
                            className="text-stone-500 dark:text-stone-400 hover:text-stone-900 dark:hover:text-stone-100 transition-colors"
                        >
                            <ArrowLeft size={24} />
                        </button>
                        <div className="h-2 flex-1 mx-4 bg-stone-200 dark:bg-stone-800 rounded-full overflow-hidden">
                            <div className="h-full bg-rose-500 transition-all duration-300" style={{ width: `${((devaIndex + 1) / devaItems.length) * 100}%` }}></div>
                        </div>
                        <div className="text-sm font-bold text-stone-500">{devaIndex + 1}/{devaItems.length}</div>
                    </div>

                    {/* Kategorie-Label im Quiz */}
                    <div className="text-center mb-4 -mt-4">
						<span className="text-xs uppercase tracking-widest text-stone-400 font-semibold text-center block w-full">
							{categoryLabel}
						</span>
					</div>

                    {/* Quiz-Frage-Bereich mit Info-Icon */}
                    <div className="relative bg-white dark:bg-stone-850 rounded-3xl shadow-xl p-10 mb-8 text-center flex flex-col justify-center items-center min-h-[200px]">
                        
                        {/* Info-Icon (erscheint nur nach Antwort & wenn Notiz da ist) */}
                        {quizAnswered && currentItem?.note && (
                            <button 
                                onClick={(e) => {
                                    e.stopPropagation();
                                    showHelp(e, TRANSLATIONS[lang].info, currentItem.note);
                                }}
                                className="absolute top-4 right-4 p-2 text-stone-300 dark:text-stone-600 hover:text-rose-400 transition-colors z-30 cursor-pointer"
                                title={lang === 'de' ? "Hinweis anzeigen" : "Show note"}
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                            </button>
                        )}

                        {isForward && currentItem?.image ? (
                            <img 
                                src={currentItem.image} 
                                alt={lang === 'de' ? "Frage" : "Question"} 
                                className="max-h-[4.1rem] w-auto object-contain bg-transparent dark:invert dark:opacity-90 dark:mix-blend-screen" 
                            />
                        ) : (
                            <div 
                                className={isForward ? "text-8xl font-deva leading-none" : "text-6xl iast-sharp font-bold text-rose-700 leading-none"}
                                style={isForward && currentItem?.font ? { fontFamily: `"${currentItem.font}", Sanskrit2003, "Noto Serif Devanagari", serif` } : {}}
                            >
                                {displayQuestion}
                            </div>
                        )}
                    </div>

                    {/* Quiz-Antwort-Optionen */}
                    <div className="grid grid-cols-2 gap-4">
                        {quizOptions.map((option, idx) => (
                            <button
                                key={idx}
                                onClick={() => handleQuizAnswer(option)}
                                className={`p-4 bg-white dark:bg-stone-850 rounded-2xl shadow-md border-2 transition-all flex flex-col items-center justify-center min-h-[100px] outline-none ${
                                    // Grün einfärben: Wenn die Antwort aufgedeckt wurde und diese Option die exakt richtige ist
                                    quizAnswered && option.t === currentItem.t && option.d === currentItem.d
                                        ? 'border-green-500 bg-green-50 dark:bg-green-900/20' 
                                        : // Rot einfärben: Wenn dies die vom Nutzer falsch gewählte Option war
                                          quizAnswered && quizSelection === option.t && (option.t !== currentItem.t || option.d !== currentItem.d)
                                            ? 'border-red-500 bg-red-50 dark:bg-red-900/20'
                                            : // Fokus-Rahmen bei Tastaturnavigation
                                              (!quizAnswered && idx === quizFocusIndex)
                                                ? 'border-rose-500 dark:border-rose-400 bg-rose-50/40 dark:bg-rose-950/20'
                                                : 'border-transparent hover:border-rose-500'
                                }`}
                            >
                                {!isForward && option?.image ? (
                                    <img 
                                        src={option.image} 
                                        alt={lang === 'de' ? "Antwort" : "Answer"} 
                                        className="max-h-[1.6rem] w-auto object-contain bg-transparent dark:invert dark:opacity-90 dark:mix-blend-screen" 
                                    />
                                ) : (
                             
                                    <span 
                                        className={isForward ? "text-2xl iast-sharp font-bold" : "text-4xl font-deva"}
                                        style={!isForward && option?.font ? { fontFamily: `"${option.font}", Sanskrit2003, "Noto Serif Devanagari", serif` } : {}}
                                    >
                                        {isForward ? option.t : option.d}
                                    </span>
                                )}
                            </button>
                        ))}
                    </div>

                    <button onClick={handleDevaNext} disabled={!quizAnswered} className="w-full mt-8 py-4 bg-rose-600 hover:bg-rose-700 text-white rounded-2xl shadow-md disabled:opacity-50 font-bold flex items-center justify-center gap-2">
                        {isLastCard ? TRANSLATIONS[lang].finish : TRANSLATIONS[lang].nextQuestion} <ArrowRight size={18} />
                    </button>
                </div>
            );
        };

        return (
            /* Wir nutzen flex-col und py-12 für gleichmäßigen Abstand oben/unten */
            <div className="min-h-screen bg-stone-100 dark:bg-stone-900 py-12 px-4 font-sans text-stone-800 dark:text-stone-200 transition-colors duration-300 flex flex-col">
                
                {/* 1. Das Header-Element (Ghost-Logik) - Jetzt ganz oben im Baum */}
                {renderHeader()}

                {/* Info-Popup bleibt absolut/fixiert */}
                {popup.visible && <InfoPopup x={popup.x} y={popup.y} content={popup.content} onClose={() => setPopup({ ...popup, visible: false })} />}
                
                {/* 2. Haupt-Container: Der onClick-Trigger umschließt den gesamten Inhalt */}
                <div className="w-full pt-4 md:pt-12 pb-24 cursor-default">
                    <div className="w-full">
                        {appState === 'home' && renderHome()}
                        {appState === 'setup_devanagari' && renderDevanagariSetup()}
                        {appState === 'devanagari_session' && renderDevanagariSession()}
                        {appState === 'texte_lesen' && (
							<FluencyTrainer 
								onExit={() => setAppState('setup_devanagari')} 
								darkMode={darkMode} 
								lang={lang} 
								isTheaterMode={isTheaterMode} 
								setIsTheaterMode={setIsTheaterMode}
							/>
						)}	
                    </div>
                </div>

                {/* MODALE (Info, Font-Settings, Editor) – Logik bleibt unverändert */}
                {showInfo && (() => {
                    const isLocal = window.location.protocol === 'file:';
                    return (
                        <div className="fixed inset-0 z-[2000] flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setShowInfo(false)}></div>
                            <div className="relative bg-white dark:bg-stone-800 w-full max-w-lg max-h-[90vh] overflow-y-auto p-8 rounded-2xl shadow-2xl border border-stone-200 dark:border-stone-700 popup-anim text-left">
                                <button onClick={() => setShowInfo(false)} className="absolute top-4 right-4 p-2 text-stone-400 hover:text-stone-600 dark:hover:text-stone-200 transition-colors">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                                </button>
                                <h2 className="text-2xl font-bold text-rose-800 dark:text-rose-400 mb-4 border-b pb-2 border-stone-100 dark:border-stone-700 flex items-center pr-10">
                                    <span className="w-8 h-8 rounded-full border-2 border-rose-800 dark:border-rose-400 flex items-center justify-center mr-3 text-base font-serif italic">i</span>
                                    {TRANSLATIONS[lang].projectInfo}
                                </h2>
                                <div className="space-y-2 text-stone-700 dark:text-stone-300 leading-relaxed text-sm">
                                    <p><strong>{TRANSLATIONS[lang].version}:</strong> Devanāgarī Trainer 2.1</p>
                                    <p><strong>{TRANSLATIONS[lang].conception}:</strong> Thomas Kintaert (<a href={TRANSLATIONS[lang].istbUrl} target="_blank" className="text-rose-600 hover:underline">{lang === 'de' ? "Institut für Südasien-, Tibet- und Buddhismuskunde [ISTB]" : "Department of South Asian, Tibetan and Buddhist Studies"}</a>, {lang === 'de' ? "Universität Wien" : "University of Vienna"})</p>
                                    <p><strong>{TRANSLATIONS[lang].period}:</strong> {lang === 'de' ? "November 2025 – Mai 2026" : "November 2025 – May 2026"}</p>
                                    <p><strong>{TRANSLATIONS[lang].techImp}:</strong><br/>{TRANSLATIONS[lang].techImpDesc}</p>
                                    <p><strong>{TRANSLATIONS[lang].sources}:</strong></p>
                                    <ul className="space-y-1 ml-1">
                                        <li>• <b>{lang === 'de' ? "360 häufigste Devanāgarī-Ligaturen" : "360 most common Devanāgarī ligatures"}:</b> Stiehl, Ulrich. „2. Die häufigsten Ligaturen im klassischen Sanskrit“. Devanagari, Sanskrit Web, S. 7–25.</li>
                                        <li>• <b>{lang === 'de' ? "Devanāgarī-Schriftart" : "Devanāgarī font"}:</b> <i>Sanskrit 2003</i>. Version 1.20, Omkarananda Ashram, 30. Juli 2019.</li>
                                    </ul>
                                    <p className="text-xs text-stone-500 dark:text-stone-400 pt-1 pl-4 border-l-2 border-stone-200 dark:border-stone-700 leading-relaxed">
                                        {TRANSLATIONS[lang].fontBackupDesc}
                                    </p>

                                    {/* Dynamischer Download- / Status-Bereich über Übersetzungsobjekte */}
                                    <div className="mt-4 p-3 rounded-xl border border-stone-200 dark:border-stone-700 bg-stone-50 dark:bg-stone-900/40 font-sans text-xs">
                                        {isLocal ? (
                                            <div className="flex items-start gap-2 text-emerald-600 dark:text-emerald-400 font-medium">
                                                <span className="text-base leading-none">✓</span>
                                                <div>
                                                    {TRANSLATIONS[lang].localStatusActive}
                                                </div>
                                            </div>
                                        ) : (
                                            <div>
                                                <p className="mb-2 text-stone-600 dark:text-stone-400">
                                                    {TRANSLATIONS[lang].downloadPrompt}
                                                </p>
                                                <a 
                                                    href="https://t-kintaert.github.io/devanagari-trainer/devanagari-trainer.zip" 
                                                    download
                                                    className="inline-flex items-center gap-2 bg-stone-200 dark:bg-stone-700 text-stone-800 dark:text-stone-200 px-3 py-1.5 rounded-lg font-bold hover:bg-stone-300 dark:hover:bg-stone-600 transition-colors outline-none"
                                                >
                                                    📥 {TRANSLATIONS[lang].downloadBtnText}
                                                </a>
                                            </div>
                                        )}
                                    </div>

                                    <p className="pt-2"><strong>{TRANSLATIONS[lang].privacy}:</strong> {TRANSLATIONS[lang].privacyDesc}</p>
                                    <p className="pt-1"><strong>{TRANSLATIONS[lang].license}:</strong> <a href={TRANSLATIONS[lang].ccUrl} target="_blank" className="text-rose-600 hover:underline">CC BY-NC-SA 4.0</a>.</p>
                                </div>
                                <button onClick={() => setShowInfo(false)} className="w-full mt-6 bg-rose-700 hover:bg-rose-800 text-white font-bold py-3 rounded-xl transition-colors shadow-lg">{TRANSLATIONS[lang].close}</button>
                            </div>
                        </div>
                    );
                })()}

        {/* FONT_SETTINGS_MODAL */}
        {showFontSettings && (
            <div className="fixed inset-0 z-[2000] flex items-center justify-center p-4">
                <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setShowFontSettings(false)}></div>
                <div className="relative bg-white dark:bg-stone-800 w-full max-w-md p-8 rounded-2xl shadow-2xl border border-stone-200 dark:border-stone-700 popup-anim">
                    <h2 className="text-xl font-bold text-stone-800 dark:text-stone-100 mb-4 flex items-center">
                        <SettingsIcon className="mr-2 text-rose-600" size={20} />
                        {TRANSLATIONS[lang].fontSettings}
                    </h2>
                    
                    <div className="space-y-4">
                        <div>
                            <label className="block text-sm font-bold text-stone-700 dark:text-stone-300 mb-2">
                                {lang === 'de' ? "Lokaler Dateiname der Devanāgarī-Unicode-Schriftart:" : "Local filename of the Devanāgarī Unicode font:"}
                            </label>

{/* CUSTOM_EDITOR_MODAL_SHELL */}

                {/* Editor-Container */}

                    {/* STICKY HEADER: Bleibt beim Scrollen oben stehen */}

                                className={`w-10 h-10 flex items-center justify-center rounded-lg border transition-all shadow-sm ${isSortMode ? 'bg-rose-600 text-white border-rose-600' : 'bg-white dark:bg-stone-800 text-stone-500 hover:text-rose-600 border-stone-200 dark:border-stone-700'}`}
                            >
                                <ArrowUpDown size={18} />
                            </button>
                            <label 
                                onMouseEnter={(e) => showHelp(e, TRANSLATIONS[lang].all, TRANSLATIONS[lang].allDesc)} 
                                onMouseLeave={cancelHelp}
                                className="h-10 flex items-center gap-1.5 px-3 bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded-lg cursor-pointer hover:bg-stone-50 dark:hover:bg-stone-750 transition-colors shadow-sm text-stone-500 hover:text-rose-600"
                            >
                                <input 
                                    type="checkbox" 
                                    checked={customCategories.length > 0 && customCategories.every(c => {
                                        if (c.isFolder && c.collections) {
                                            return c.active && c.collections.every(sub => sub.active);
                                        }
                                        return c.active;
                                    })} 
                                    onChange={(e) => { 
                                        const isChecked = e.target.checked; 
                                        setCustomCategories(prev => prev.map(c => {
                                            if (c.isFolder && c.collections) {
                                                const updatedSubs = c.collections.map(sub => ({ ...sub, active: isChecked }));
                                                return { ...c, active: isChecked, collections: updatedSubs };
                                            }
                                            return { ...c, active: isChecked };
                                        })); 
                                    }} 
                                    className="w-4 h-4 accent-rose-600 cursor-pointer" 
                                />
                                <span className="text-[10px] font-bold uppercase select-none">{TRANSLATIONS[lang].all}</span>
                            </label>
                            {/* Dynamischer Toggle für alle ein-/ausklappen */}
                            <button 
                                onClick={() => {
                                    const allIds = customCategories.map(c => c.id);
                                    const areAllExpanded = allIds.length > 0 && allIds.every(id => expandedCats.includes(id));
                                    toggleAllCats(!areAllExpanded);
                                }} 
                                onMouseEnter={(e) => {
                                    const allIds = customCategories.map(c => c.id);
                                    const areAllExpanded = allIds.length > 0 && allIds.every(id => expandedCats.includes(id));
                                    showHelp(e, 
                                        areAllExpanded ? TRANSLATIONS[lang].collapse : TRANSLATIONS[lang].expand, 
                                        areAllExpanded ? TRANSLATIONS[lang].collapseDesc : TRANSLATIONS[lang].expandDesc
                                    );
                                }} 
                                onMouseLeave={cancelHelp}
                                className="w-10 h-10 flex items-center justify-center bg-white dark:bg-stone-800 text-stone-500 hover:text-rose-600 rounded-lg shadow-sm border border-stone-200 dark:border-stone-700 transition-colors shrink-0"
                            >
                                {customCategories.map(c => c.id).every(id => expandedCats.includes(id)) && customCategories.length > 0 ? (
                                    // Korrektes Icon für "Alles einklappen" (Kollabieren)

                                ) : (
                                    // Neues, sauberes Icon für "Alles ausklappen" (Expandieren)
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
                                )}
                            </button>
                            <button 
                                onClick={() => { setStudyModeContent('custom'); setStudySearch(""); }} 
                                onMouseEnter={(e) => showHelp(e, TRANSLATIONS[lang].viewMode, TRANSLATIONS[lang].viewModeDesc)} 
                                onMouseLeave={cancelHelp}
                                className="w-10 h-10 flex items-center justify-center bg-white dark:bg-stone-800 text-stone-500 hover:text-rose-600 rounded-lg shadow-sm border border-stone-200 dark:border-stone-700 transition-colors"
                            >
                                <EyeIcon size={18} />
                            </button>
                            <button 
                                onClick={exportData} 
                                onMouseEnter={(e) => showHelp(e, TRANSLATIONS[lang].export, TRANSLATIONS[lang].exportDesc)} 
                                onMouseLeave={cancelHelp}
                                className="w-10 h-10 flex items-center justify-center bg-white dark:bg-stone-800 text-stone-500 hover:text-rose-600 rounded-lg shadow-sm border border-stone-200 dark:border-stone-700 transition-colors"
                            >
                                <ExportIcon size={18} />
                            </button>
                            <label 
                                onMouseEnter={(e) => showHelp(e, TRANSLATIONS[lang].import, TRANSLATIONS[lang].importDesc)} 
                                onMouseLeave={cancelHelp}
                                className="w-10 h-10 flex items-center justify-center bg-white dark:bg-stone-800 text-stone-500 hover:text-rose-600 rounded-lg shadow-sm border border-stone-200 dark:border-stone-700 transition-colors cursor-pointer"
                            >
                                <ImportIcon size={18} /><input type="file" accept=".json" onChange={importData} className="hidden" />
                            </label>
                            <button 
                                onClick={() => { setShowOnlineLibrary(true); window.loadOnlinePoolIndex(); }} 
                                onMouseEnter={(e) => showHelp(e, TRANSLATIONS[lang].onlinePoolBtn, TRANSLATIONS[lang].onlinePoolDesc)} 
                                onMouseLeave={cancelHelp}
                                className="h-10 px-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-lg text-[10px] uppercase tracking-wider shadow-sm transition-colors flex items-center justify-center gap-1 outline-none"
                            >
                                {TRANSLATIONS[lang].onlinePoolBtn}
                            </button>
                        </div>

                        {/* Kategorien-Header */}
                        {(() => {
                            // Erstellt die Funktion zum Hinzufügen eines neuen Hauptordners auf window-Ebene
                            window.addFolder = () => {
                                const folderName = prompt(TRANSLATIONS[lang].folderNamePlaceholder) || "";
                                if (!folderName.trim()) return;
                                
                                const newFolder = {
                                    id: 'folder_' + Date.now(),
                                    name: folderName.trim(),
                                    active: true,
                                    isFolder: true,
                                    collections: [] // Hierin landen später die Unter-Sammlungen
                                };
                                // newFolder wird jetzt an den Anfang (vor ...prev) gesetzt:
                                setCustomCategories(prev => [newFolder, ...prev]);
                            };
                            return null;
                        })()}

                        <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 pb-4 bg-white dark:bg-stone-800">
                            <h3 className="text-sm font-bold uppercase tracking-wider text-stone-500 dark:text-stone-400">{TRANSLATIONS[lang].myCollections}</h3>
                            <div className="flex flex-wrap gap-2">
                                <button 
                                    onClick={window.addFolder} 
                                    className="text-xs bg-stone-100 dark:bg-stone-700 text-stone-700 dark:text-stone-300 px-3 py-2 rounded-lg font-bold hover:bg-stone-200 dark:hover:bg-stone-600 transition-colors border border-stone-200 dark:border-stone-600"
                                >
                                    {TRANSLATIONS[lang].addFolder}
                                </button>
                                <button 
                                    onClick={addCategory} 
                                    className="text-xs bg-rose-100 dark:bg-rose-900/30 text-rose-700 dark:text-rose-300 px-3 py-2 rounded-lg font-bold hover:bg-rose-200 transition-colors"
                                >
                                    {TRANSLATIONS[lang].addCat}
                                </button>
                            </div>
                        </div>
                        <div className="h-px bg-stone-100 dark:border-stone-700 mb-4"></div>
                    </div>

            {/* Der Inhaltsbereich (scrollbar) */}
            <div className="px-6 md:px-8 pt-0 flex-1 overflow-y-auto custom-scrollbar">

                        {/* CATEGORY_LOOP_FIXED */}
                            {customCategories.map(cat => {
                                const isExpanded = expandedCats.includes(cat.id);
                                if (!window._showInfoFields) window._showInfoFields = {};
                                const infoVisible = !!window._showInfoFields[cat.id];
                                const isFolder = !!cat.isFolder;

                                // Logik für Ordner-Checkbox: Aktiviert/Deaktiviert alle Unter-Sammlungen
                                const handleFolderCheckboxChange = (isChecked) => {
                                    setCustomCategories(prev => prev.map(c => {
                                        if (c.id === cat.id) {
                                            const updatedSubCollections = (c.collections || []).map(sub => ({ ...sub, active: isChecked }));
                                            return { ...c, active: isChecked, collections: updatedSubCollections };
                                        }
                                        return c;
                                    }));
                                };

                                return (
                                    <div 
                                        key={cat.id} 
                                        className={`p-2.5 md:p-3 rounded-xl border mb-3 transition-all w-full box-border overflow-hidden ${
                                            isFolder 
                                                ? 'bg-stone-50 dark:bg-stone-850 border-rose-700/40 dark:border-rose-500/40 shadow-sm ring-1 ring-rose-700/5' 
                                                : 'bg-stone-50 dark:bg-stone-850 border-stone-100 dark:border-stone-700'
                                        }`}
                                    >
                                        <div className="flex items-center justify-between flex-nowrap gap-1.5 md:gap-3 w-full min-w-0">
                                            <div className="flex items-center flex-nowrap gap-1.5 md:gap-2 min-w-0 flex-1">
                                                <button onClick={() => toggleCatExpanded(cat.id)} className="p-1 hover:bg-stone-200 dark:hover:bg-stone-700 rounded text-stone-400 text-base shrink-0">
                                                    {isFolder ? (isExpanded ? '📂' : '📁') : (isExpanded ? <ChevronDown size={16} /> : <ChevronRight size={16} />)}
