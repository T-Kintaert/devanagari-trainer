                                                {isSortMode && (
                                                    <div className="flex flex-col -space-y-1 shrink-0">
                                                        <button onClick={() => moveCategory(cat.id, -1)} className="text-stone-400 hover:text-rose-600"><ChevronUp size={12} /></button>
                                                        <button onClick={() => moveCategory(cat.id, 1)} className="text-stone-400 hover:text-rose-600"><ChevronDown size={12} /></button>
                                                    </div>
                                                )}
                                                
                                                <input 
                                                    type="checkbox" 
                                                    checked={isFolder ? (cat.collections && cat.collections.length > 0 && cat.collections.some(c => c.active)) : cat.active}
                                                    onChange={(e) => {
                                                        if (isFolder) {
                                                            handleFolderCheckboxChange(e.target.checked);
                                                        } else {
                                                            updateCategory(cat.id, 'active', e.target.checked);
                                                        }
                                                    }} 
                                                    className={`w-4 h-4 md:w-5 md:h-5 shrink-0 cursor-pointer accent-rose-700 ${
                                                        isFolder && cat.collections && !cat.collections.every(c => c.active) && cat.collections.some(c => c.active)
                                                            ? 'opacity-40' 
                                                            : ''
                                                    }`} 
                                                />
                                                
                                                <input 
                                                    type="text" 
                                                    value={cat.name} 
                                                    onChange={(e) => updateCategory(cat.id, 'name', e.target.value)} 
                                                    className={`w-full bg-transparent border-b border-transparent focus:border-rose-500 outline-none font-bold text-xs md:text-base min-w-[60px] truncate ${
                                                        isFolder 
                                                            ? 'text-rose-800 dark:text-rose-400' 
                                                            : 'text-stone-800 dark:text-stone-200'
                                                    } ${
                                                        isFolder && cat.collections && !cat.collections.every(c => c.active) && cat.collections.some(c => c.active)
                                                            ? 'italic opacity-75' 
                                                            : ''
                                                    }`} 
                                                />
                                            </div>
                                            
                                            <div className="flex items-center flex-nowrap gap-1 md:gap-2 shrink-0">
                                                {/* Kleiner Info-Button am Ende des Namens */}
                                                <button 
                                                    onClick={() => {
                                                        window._showInfoFields[cat.id] = !window._showInfoFields[cat.id];
                                                        updateCategory(cat.id, '_rerender', Date.now());
                                                    }} 
                                                    className={`p-1 md:p-1.5 rounded-lg transition-colors border shrink-0 ${infoVisible ? 'bg-rose-50 text-rose-600 border-rose-200 dark:bg-rose-950/40 dark:text-rose-400 dark:border-rose-900' : 'text-stone-400 hover:text-stone-600 dark:hover:text-stone-300 border-transparent'}`}
                                                    title={TRANSLATIONS[lang].collectionInfoLabel}
                                                >
                                                    <span className="w-3.5 h-3.5 md:w-4 md:h-4 flex items-center justify-center font-serif italic text-[11px] md:text-xs font-bold">i</span>
                                                </button>

                                                {/* Dropdown zum Verschieben der gesamten Sammlung */}
                                                {!isFolder && (
                                                    <select
                                                        onChange={(e) => {
                                                            const targetFolderId = e.target.value;
                                                            setCustomCategories(prev => {
                                                                const currentCat = prev.find(c => c.id === cat.id);
                                                                if (!currentCat) return prev;

                                                                let cleaned = prev.filter(c => c.id !== cat.id).map(c => {
                                                                    if (c.isFolder && c.collections) {
                                                                        return { ...c, collections: c.collections.filter(sub => sub.id !== cat.id) };
                                                                    }
                                                                    return c;
                                                                });

                                                                if (targetFolderId === "root") {
                                                                    return [currentCat, ...cleaned];
                                                                } else {
                                                                    return cleaned.map(c => {
                                                                        if (c.id === targetFolderId) {
                                                                            const subs = c.collections || [];
                                                                            if (!subs.some(sub => sub.id === cat.id)) {
                                                                                return { ...c, collections: [...subs, currentCat] };
                                                                            }
                                                                        }
                                                                        return c;
                                                                    });
                                                                }
                                                            });
                                                            e.target.value = "";
                                                        }}
                                                        defaultValue=""
                                                        className="text-[9px] md:text-[10px] bg-stone-100 dark:bg-stone-900 border border-stone-200 dark:border-stone-700 rounded px-1 py-0.5 text-stone-500 outline-none w-[65px] md:w-[110px] cursor-pointer shrink-0"
                                                    >
                                                        <option value="" disabled>{lang === 'de' ? "Ordner..." : "Folder..."}</option>
                                                        <option value="root">{(TRANSLATIONS[lang] && TRANSLATIONS[lang].folderRoot) || "❌ Hauptverzeichnis"}</option>
                                                        {customCategories
                                                            .filter(c => c.isFolder && c.id !== cat.id)
                                                            .map(f => (
                                                                <option key={f.id} value={f.id}>📁 {f.name}</option>
                                                            ))
                                                    }
                                                    </select>
                                                )}

                                                <button onClick={() => deleteCategory(cat.id)} className="p-1 text-stone-300 hover:text-red-500 shrink-0"><XIcon size={16} /></button>
                                            </div>
                                        </div>

                                        {/* Das ausklappbare Info-/Copyright-Feld direkt unter dem Titel */}
                                        {infoVisible && (
                                            <div className="mb-3 px-1 font-sans">
                                                <label className="block text-[10px] font-bold text-stone-400 dark:text-stone-500 uppercase tracking-wider mb-1">
                                                    {TRANSLATIONS[lang].collectionInfoLabel}
                                                </label>
                                                <input 
                                                    type="text" 
                                                    value={cat.description || ''} 
                                                    onChange={(e) => updateCategory(cat.id, 'description', e.target.value)}
                                                    placeholder={TRANSLATIONS[lang].collectionInfoPlaceholder}
                                                    className="w-full p-2 border border-stone-200 dark:border-stone-700 bg-white dark:bg-stone-900 text-xs rounded-lg outline-none focus:border-rose-500 dark:text-stone-300 italic"
                                                />
                                            </div>
                                        )}

                                        {/* Unter-Sammlungen im Ordner anzeigen */}
                                        {isFolder && isExpanded && (

                                                {(cat.collections || []).map((subCat, subIdx) => {
                                                    const subInfoVisible = !!window._showInfoFields[subCat.id];
                                                    const subExpanded = expandedCats.includes(subCat.id);
                                                    return (
                                                        <div key={subCat.id} className="p-2 bg-white dark:bg-stone-800 border border-stone-200/60 dark:border-stone-700 rounded-lg shadow-sm">
                                                            <div className="flex items-center justify-between flex-nowrap gap-2 w-full min-w-0">
                                                                <div className="flex items-center flex-nowrap gap-2 min-w-0 flex-1">
                                                                    <button onClick={() => toggleCatExpanded(subCat.id)} className="p-1 hover:bg-stone-200 dark:hover:bg-stone-700 rounded text-stone-400 text-xs shrink-0">
                                                                        {subExpanded ? <ChevronDown size={14} /> : <ChevronRight size={14} />}

                                                                    {/* Sortierpfeile für Sammlungen innerhalb des Ordners */}

                                                                        <div className="flex flex-col -space-y-1 shrink-0">
                                                                            <button 
                                                                                onClick={() => {
                                                                                    if (subIdx === 0) return;
                                                                                    setCustomCategories(prev => prev.map(c => {
                                                                                        if (c.id !== cat.id) return c;
                                                                                        const nextSubs = [...(c.collections || [])];
                                                                                        [nextSubs[subIdx], nextSubs[subIdx - 1]] = [nextSubs[subIdx - 1], nextSubs[subIdx]];
                                                                                        return { ...c, collections: nextSubs };
                                                                                    }));
                                                                                }} 
                                                                                className="text-stone-300 hover:text-rose-600"
                                                                            ><ChevronUp size={14} /></button>
                                                                            <button 
                                                                                onClick={() => {
                                                                                    if (subIdx === cat.collections.length - 1) return;
                                                                                    setCustomCategories(prev => prev.map(c => {
                                                                                        if (c.id !== cat.id) return c;
                                                                                        const nextSubs = [...(c.collections || [])];
                                                                                        [nextSubs[subIdx], nextSubs[subIdx + 1]] = [nextSubs[subIdx + 1], nextSubs[subIdx]];
                                                                                        return { ...c, collections: nextSubs };
                                                                                    }));
                                                                                }} 
                                                                                className="text-stone-300 hover:text-rose-600"
                                                                            ><ChevronDown size={14} /></button>
                                                                        </div>
                                                                    )}

                                                                    <input 
                                                                        type="checkbox" 
                                                                        checked={subCat.active} 
                                                                        onChange={(e) => {
                                                                            const isChecked = e.target.checked;
                                                                            setCustomCategories(prev => prev.map(c => {
                                                                                if (c.id === cat.id) {
                                                                                    const updatedSubs = (c.collections || []).map(sub => sub.id === subCat.id ? { ...sub, active: isChecked } : sub);
                                                                                    return { ...c, collections: updatedSubs };
                                                                                }
                                                                                return c;
                                                                            }));
                                                                        }} 
                                                                        className="w-4 h-4 accent-rose-600 shrink-0" 
                                                                    />
                                                                    <input 
                                                                        type="text" 
                                                                        value={subCat.name} 
                                                                        onChange={(e) => {
                                                                            const newName = e.target.value;
                                                                            setCustomCategories(prev => prev.map(c => {
                                                                                if (c.id === cat.id) {
                                                                                    const updatedSubs = (c.collections || []).map(sub => sub.id === subCat.id ? { ...sub, name: newName } : sub);
                                                                                    return { ...c, collections: updatedSubs };
                                                                                }
                                                                                return c;
                                                                            }));
                                                                        }} 
                                                                        className="w-full bg-transparent border-b border-transparent focus:border-rose-500 outline-none font-medium text-xs md:text-sm min-w-[50px] truncate text-stone-800 dark:text-stone-200" 
                                                                    />
                                                                </div>

                                                                <div className="flex items-center flex-nowrap gap-1.5 shrink-0">
                                                                    <button 
                                                                        onClick={() => {
                                                                            window._showInfoFields[subCat.id] = !window._showInfoFields[subCat.id];
                                                                            updateCategory(cat.id, '_rerender', Date.now());
                                                                        }} 
                                                                        className={`p-1 rounded transition-colors border shrink-0 ${subInfoVisible ? 'bg-rose-50 text-rose-600 border-rose-200 dark:bg-rose-950/40 dark:text-rose-400' : 'text-stone-400 border-transparent'}`}

                                                                        <span className="w-3 h-3 flex items-center justify-center font-serif italic text-[10px] font-bold">i</span>
                                                                    </button>

                                                                    {/* Dropdown unterstützt jetzt Kopieren und Verschieben ins Hauptverzeichnis */}
                                                                    <select
                                                                        onChange={(e) => {
                                                                            const act = e.target.value;
                                                                            if (!act) return;
                                                                            window.executeCatAction(act, subCat, "root");
                                                                            e.target.value = "";
                                                                        }}
                                                                        defaultValue=""
                                                                        className="text-[9px] bg-stone-100 dark:bg-stone-900 border border-stone-200 rounded px-1 py-0.5 text-stone-500 outline-none w-[65px] md:w-[100px] cursor-pointer shrink-0"

                                                                        <option value="" disabled>{lang === 'de' ? "Aktion..." : "Action..."}</option>
                                                                        <option value="move">📦 {lang === 'de' ? "Verschieben" : "Move"}</option>
                                                                        <option value="copy">📄 {lang === 'de' ? "Kopieren" : "Copy"}</option>
                                                                    </select>

                                                                    <button

                {/* Scrollbare Liste der Ziele */}
                <div className="overflow-y-auto flex-1 space-y-1 pr-1 custom-scrollbar">
                    {availableTargets.map(target => (
                        <button
                            key={target.id}
                            onClick={() => {
                                window._itemTargetSearch = "";
                                window.executeItemAction(action, fromCatId, item, target.id);
                            }}
                            className="w-full p-2.5 text-left text-xs bg-stone-50 hover:bg-rose-50 dark:bg-stone-800 dark:hover:bg-rose-950/30 rounded-lg border border-stone-100 dark:border-stone-700 transition-colors text-stone-700 dark:text-stone-300 font-medium truncate block"
                        >
                            🎯 {target.name}
                        </button>
                    ))}
                    {availableTargets.length === 0 && (
                        <div className="text-center py-6 text-xs text-stone-400 italic">
                            {txtNoResults}
                        </div>
                    )}
                </div>
                
                <button 
                    onClick={() => { window._itemTargetSearch = ""; setActiveItemAction(null); }}
                    className="w-full mt-4 bg-stone-200 dark:bg-stone-700 hover:bg-stone-300 text-stone-800 dark:text-stone-200 font-bold py-2 rounded-xl text-xs transition-colors"
                >
                    {txtCancel}
                </button>
            </div>
        </div>
    );
})()}

{/* GITHUB_ONLINE_LIBRARY_MODAL */}
        {showOnlineLibrary && (
            <div className="fixed inset-0 z-[5000] flex items-center justify-center p-4 animate-in fade-in duration-200">
                <div className="absolute inset-0 bg-stone-100 dark:bg-stone-900" onClick={() => setShowOnlineLibrary(false)}></div>
                <div className="relative bg-white dark:bg-stone-850 w-full max-w-2xl max-h-[85vh] rounded-2xl shadow-2xl border border-stone-200 dark:border-stone-700 p-6 md:p-8 popup-anim flex flex-col">
                    
                    <div className="flex justify-between items-center mb-4 border-b dark:border-stone-700 pb-3">
                        <h3 className="text-lg font-bold text-rose-800 dark:text-rose-400 flex items-center gap-2">
                            {TRANSLATIONS[lang].onlineLibraryTitle}
                        </h3>
                        <button onClick={() => setShowOnlineLibrary(false)} className="text-stone-400 hover:text-stone-600 dark:hover:text-stone-200 outline-none">
                            <XIcon size={22} />
                        </button>
                    </div>

                    {/* Suchleiste für Pool-Inhalt */}
                    <div className="relative mb-3">
                        <input 
                            type="text"
                            placeholder={TRANSLATIONS[lang].searchIndexPlaceholder}
                            value={onlineSearch}
                            onChange={(e) => setOnlineSearch(e.target.value)}
                            className="w-full p-2.5 bg-stone-100 dark:bg-stone-900 border border-stone-200 dark:border-stone-700 rounded-xl outline-none focus:border-rose-500 text-sm text-stone-800 dark:text-stone-200"
                        />
                    </div>

                    {/* Scrollbare Inhaltsliste */}
                    <div className="flex-1 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
                        {onlineLoading && (
                            <div className="text-center py-10 text-xs italic text-stone-400">
                                {TRANSLATIONS[lang].loadingIndex}
                            </div>
                        )}
                        
                        {onlinePool && (() => {
                            const keys = Object.keys(onlinePool).filter(k => {
                                const entry = onlinePool[k];
                                const term = onlineSearch.toLowerCase();
                                return k.toLowerCase().includes(term) || 
                                       (entry.name_de || "").toLowerCase().includes(term) || 
                                       (entry.name_en || "").toLowerCase().includes(term) ||
                                       (entry.author || "").toLowerCase().includes(term);
                            });
                            
                            if (keys.length === 0 && !onlineLoading) {
                                return <div className="text-center py-8 text-xs text-stone-400 italic">{TRANSLATIONS[lang].noEntriesFound}</div>;
                            }

                            return keys.map(code => {
                                const fileObj = onlinePool[code];
                                const resolvedName = lang === 'de' ? (fileObj.name_de || fileObj.name_en) : (fileObj.name_en || fileObj.name_de);
                                const resolvedDesc = lang === 'de' ? (fileObj.desc_de || fileObj.desc_en) : (fileObj.desc_en || fileObj.desc_de);
                                
                                return (
                                    <div key={code} className="p-3 bg-stone-50 dark:bg-stone-800/60 rounded-xl border border-stone-100 dark:border-stone-700/50 flex justify-between items-center gap-4 text-left">
                                        <div className="min-w-0 flex-1">
                                            <h4 className="font-bold text-sm text-stone-800 dark:text-stone-200 truncate">
                                                {resolvedName}
                                            </h4>
                                            <p className="text-[11px] text-stone-500 mt-1 italic leading-tight">
                                                {resolvedDesc}
                                            </p>
                                            {fileObj.author && (
                                                <p className="text-[9px] font-bold uppercase tracking-wider text-stone-400 mt-1">
                                                    👤 {fileObj.author}
                                                </p>
                                            )}
                                        </div>
                                        <button 
                                            onClick={async () => {
                                                const res = await window.importCollectionWithId(code);
                                                if (res) {
                                                    const displayTitle = res[`name_${lang}`] || res.filename;
                                                    alert(`${TRANSLATIONS[lang].onlineImportSuccess}"${displayTitle}"`);
                                                }
                                            }}
                                            className="bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs px-3 py-2 rounded-xl shrink-0 shadow-sm transition-colors outline-none"
                                        >
                                            {TRANSLATIONS[lang].addBtn}
                                        </button>
                                    </div>
                                );
                            });
                        })()}
                    </div>

                    <button 
                        onClick={() => setShowOnlineLibrary(false)}
                        className="w-full mt-4 bg-stone-100 dark:bg-stone-800 hover:bg-stone-200 dark:hover:bg-stone-700 text-stone-700 dark:text-stone-200 font-bold py-3 rounded-xl text-xs transition-colors shadow-inner outline-none"
                    >
                        {TRANSLATIONS[lang].close}
                    </button>
                </div>
            </div>
        )}
		
{/* UNIVERSAL_STUDY_OVERLAY_V15 */}
		{studyModeContent && (
			<div className="fixed inset-0 z-[3000] flex items-center justify-center p-4">
				<div className="absolute inset-0 bg-stone-900/80 backdrop-blur-md" onClick={() => setStudyModeContent(null)}></div>
				
				<div className="relative bg-white dark:bg-stone-850 w-full max-w-5xl max-h-[90vh] flex flex-col overflow-hidden rounded-3xl shadow-2xl p-6 md:p-12 popup-anim border border-stone-200 dark:border-stone-700">
					
					{/* Schließen-Button */}
					<button 
						onClick={() => setStudyModeContent(null)} 
						className="absolute top-6 right-10 md:top-8 md:right-14 p-2 transition-colors z-50 text-stone-400 hover:text-rose-600 outline-none"
						title={TRANSLATIONS[lang].close}
					>
						<XIcon size={28} />
					</button>
					<div className="overflow-y-auto p-6 md:p-12 h-full">

					{/* Header-Layout */}
					<div className="flex flex-col md:flex-row items-start md:items-end mb-8 border-b dark:border-stone-700 pb-6 gap-10 pr-20 relative">
						
						<div className="shrink-0">
							<h2 className="text-3xl font-bold text-stone-800 dark:text-stone-100 flex items-center gap-3">
								<EyeIcon size={28} className="text-rose-600" />
								{studyModeContent === 'custom' 
									? (lang === 'de' ? 'Eigene Zeichen' : 'Custom characters') 
									: (studyModeContent === 'basic' ? TRANSLATIONS[lang].catBasic : 
									   studyModeContent === 'diacritics' ? TRANSLATIONS[lang].catDiacritics : 
									   studyModeContent === 'ligatures' ? TRANSLATIONS[lang].catLigatures : TRANSLATIONS[lang].catDigits)
								}
							</h2>
							<p className="text-stone-500 mt-1 text-sm flex items-center gap-2">
								{studySearch ? TRANSLATIONS[lang].searchActive : TRANSLATIONS[lang].libraryTitle}
								<span className="inline-block px-2 py-0.5 bg-stone-100 dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded text-[10px] font-bold text-rose-600 uppercase tracking-wider">
									{studyModeContent === 'custom' 
										? customCategories.filter(c => c.active).reduce((acc, cat) => acc + (cat.items?.length || 0), 0)
										: DEVANAGARI_DATA[studyModeContent]?.length || 0} {TRANSLATIONS[lang].chars}
								</span>
							</p>
						</div>

						{/* Suchfeld */}
						<div className="relative w-full md:w-72 mb-0.5">
							<input 
								type="text"
								placeholder={TRANSLATIONS[lang].search}
								value={studySearch}
								onChange={(e) => setStudySearch(e.target.value)}
								className="w-full pl-4 pr-10 py-2 bg-stone-100 dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded-xl outline-none focus:border-rose-500 transition-all text-sm"
							/>
							{studySearch && (
								<button onClick={() => setStudySearch("")} className="absolute right-3 top-1/2 -translate-y-1/2 text-stone-400 hover:text-rose-500">
									<XIcon size={16} />
								</button>
							)}
						</div>

					</div>

					<div className="space-y-16">
						{/* Standardkategorien */}
						{['basic', 'diacritics', 'ligatures', 'digits'].includes(studyModeContent) && (
							<div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6">
								{DEVANAGARI_DATA[studyModeContent]
									.filter(item => 
										item.d.includes(studySearch) || 
										item.t.toLowerCase().includes(studySearch.toLowerCase())
									)
									.map((item, idx) => (
										<div key={idx} className="relative flex flex-col items-center p-6 bg-stone-50 dark:bg-stone-800/50 rounded-2xl border border-stone-100 dark:border-stone-700 transition-all">
											<div 
												className="text-6xl mb-4 font-deva text-stone-800 dark:text-stone-100 h-20 flex items-center justify-center"
												style={item.font ? { fontFamily: `"${item.font}", Sanskrit2003, serif` } : {}}
											>
												{item.d}
											</div>
											<div className="text-xl font-bold text-rose-600 dark:text-rose-500 iast-sharp">{item.t}</div>
										</div>
									))}
							</div>
						)}

						{/* Eigene Zeichen */}
						{studyModeContent === 'custom' && (() => {
							// 1. Hilfsfunktion zur rekursiven Extraktion aller Sammlungen aus der Struktur
							const getAllCollections = (list) => {
								let result = [];
								list.forEach(c => {
									if (c.isFolder && c.collections) {
										result = [...result, ...getAllCollections(c.collections)];
									} else if (!c.isFolder) {
										result.push(c);
									}
								});
								return result;
							};

							// 2. Flache Liste aller aktiven Sammlungen holen
							const allActiveCollections = getAllCollections(customCategories).filter(c => c.active);

							return allActiveCollections.map(cat => {
								const filteredItems = (cat.items || []).filter(item => 
									(item.char || "").includes(studySearch) || 
									(item.iast || "").toLowerCase().includes(studySearch.toLowerCase())
								);

								if (studySearch && filteredItems.length === 0) return null;

								return (
									<div key={cat.id} className="animate-in fade-in slide-in-from-bottom-4 duration-500 mb-12">
										<h3 className="text-xl font-bold text-rose-700 dark:text-rose-400 mb-6 flex items-center gap-2">
											<div className="w-2 h-8 bg-rose-500 rounded-full"></div>
											{cat.name}
											<span className="text-sm font-normal text-stone-400 ml-2">
												({filteredItems.length} {TRANSLATIONS[lang].chars})
											</span>
										</h3>
										<div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
											{filteredItems.map((item, idx) => (
												<div key={idx} className="group flex flex-col items-center p-6 bg-stone-50 dark:bg-stone-800/50 rounded-2xl border border-stone-100 dark:border-stone-700 hover:border-rose-300 dark:hover:border-rose-900 transition-all">
													<div 
														className="text-6xl mb-4 font-deva text-stone-800 dark:text-stone-100 h-20 flex items-center justify-center group-hover:scale-110 transition-transform"
														style={(item.font || cat.font) ? { fontFamily: `"${item.font || cat.font}", Sanskrit2003, serif` } : {}}
													>
														{item.image ? <img src={item.image} className="h-full w-auto object-contain dark:invert opacity-90" /> : item.char}
													</div>
													<div className="text-xl font-bold text-rose-600 dark:text-rose-500 iast-sharp">{item.iast}</div>
													{item.note && <div className="mt-3 text-[11px] italic text-stone-400 dark:text-stone-500 text-center leading-tight border-t border-stone-200 dark:border-stone-700 pt-2 w-full">{item.note}</div>}
												</div>
											))}
										</div>
									</div>
								);
							});
						})()}

{/* Leermeldung (angepasst an rekursive Ordner-Struktur) */}
{studySearch && studyModeContent === 'custom' && (() => {
    const getAllItems = (list) => {
        let items = [];
        list.forEach(c => {
            if (c.isFolder && c.collections) {
                items = [...items, ...getAllItems(c.collections)];
            } else if (!c.isFolder && c.active && c.items) {
                items = [...items, ...c.items];
            }
        });
        return items;
    };
    const totalMatchCount = getAllItems(customCategories).filter(item => 
        (item.char || "").includes(studySearch) || 
        (item.iast || "").toLowerCase().includes(studySearch.toLowerCase())
    ).length;

    return totalMatchCount === 0 ? (
        <div className="text-center py-20 text-stone-400 italic">
            {TRANSLATIONS[lang].noResults} "{studySearch}".
        </div>
    ) : null;
})()}
						
						{/* Leermeldung */}
						{studySearch && studyModeContent === 'custom' && customCategories.filter(c => c.active).every(c => (c.items || []).filter(item => (item.char || "").includes(studySearch) || (item.iast || "").toLowerCase().includes(studySearch.toLowerCase())).length === 0) && (
							<div className="text-center py-20 text-stone-400 italic">
								{TRANSLATIONS[lang].noResults} "{studySearch}".
							</div>
						)}
					</div>
				</div>
			</div>
		  </div>
		)}
    </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<SanskritTrainer />);
</script>
</div>
</body>
</html>
